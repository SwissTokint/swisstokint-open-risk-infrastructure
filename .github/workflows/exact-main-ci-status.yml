name: Exact main CI status

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# This workflow is intentionally privileged but does not check out repository
# code or consume artifacts from the upstream workflow. It only publishes the
# GitHub-generated result of a completed main-branch push CI run onto that
# run's exact head SHA.
permissions:
  statuses: write

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.path == '.github/workflows/ci.yml' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      UPSTREAM_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      STATUS_CONTEXT: pom-rx/exact-main-ci
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish exact-main CI status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = os.environ['HEAD_REPOSITORY']
          sha = os.environ['HEAD_SHA']
          workflow_path = os.environ['UPSTREAM_WORKFLOW_PATH']
          conclusion = os.environ['RUN_CONCLUSION']
          run_url = os.environ['RUN_URL']
          context = os.environ['STATUS_CONTEXT']

          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise SystemExit('invalid repository identity')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('invalid exact-main head SHA')
          if workflow_path != '.github/workflows/ci.yml':
              raise SystemExit('unexpected upstream workflow path')
          expected_run_prefix = f'https://github.com/{repository}/actions/runs/'
          if not run_url.startswith(expected_run_prefix):
              raise SystemExit('workflow-run URL is not bound to this repository')
          run_id = run_url.removeprefix(expected_run_prefix)
          if not run_id.isascii() or not run_id.isdigit():
              raise SystemExit('workflow-run URL has an invalid run id')
          if context != 'pom-rx/exact-main-ci':
              raise SystemExit('unexpected status context')

          state = 'success' if conclusion == 'success' else 'failure'
          description = (
              'Exact main CI succeeded.'
              if state == 'success'
              else f'Exact main CI concluded: {conclusion or "unknown"}.'
          )
          payload = json.dumps({
              'state': state,
              'target_url': run_url,
              'description': description[:140],
              'context': context,
          })
          status_path = f'repos/{repository}/statuses/{sha}'
          status_url = f'https://api.github.com/{status_path}'

          result = subprocess.run(
              ['gh', 'api', '--method', 'POST', status_path, '--input', '-'],
              input=payload,
              text=True,
              capture_output=True,
              check=False,
              timeout=20,
          )
          if result.returncode != 0:
              raise SystemExit('commit-status publication failed')

          body = json.loads(result.stdout)
          # GitHub's create-status response has no separate `sha` field. Its
          # documented resource URL carries the exact requested SHA.
          if body.get('url') != status_url:
              raise SystemExit('commit-status API response was not bound to exact head resource')
          if body.get('context') != context:
              raise SystemExit('commit-status API response changed the status context')
          if body.get('state') != state:
              raise SystemExit('commit-status API response changed the status state')
          if body.get('target_url') != run_url:
              raise SystemExit('commit-status API response changed the workflow-run target')
          PY
