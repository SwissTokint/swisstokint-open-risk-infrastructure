name: CORE-001 Promise boundary writer v2

on:
  push:
    branches:
      - core/durable-gate-v2-20260830
    paths:
      - .github/workflows/core001-promise-boundary-writer-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: core/durable-gate-v2-20260830
          fetch-depth: 0
      - name: Prove baseline substitution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/pom-rx-core-durable-promise-prototype-regression.node.test.mjs')
          s = p.read_text()
          s = s.replace(
              "    assert.equal(attackDispatches, 0, 'durable awaits must not dispatch through mutable Promise.prototype.then');",
              "    console.error('BASELINE_PROMISE_POISON_DISPATCHES', attackDispatches);",
              1,
          )
          p.write_text(s)
          PY
          node --test tests/pom-rx-core-durable-promise-prototype-regression.node.test.mjs || true
          git checkout -- tests/pom-rx-core-durable-promise-prototype-regression.node.test.mjs
      - name: Apply repair
        run: python scripts/tmp-core001-promise-boundary-patch.py
      - name: Prove candidate state integrity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/pom-rx-core-durable-promise-prototype-regression.node.test.mjs')
          s = p.read_text()
          s = s.replace(
              "    assert.equal(attackDispatches, 0, 'durable awaits must not dispatch through mutable Promise.prototype.then');",
              "    console.error('CANDIDATE_PROMISE_POISON_DISPATCHES', attackDispatches);",
              1,
          )
          p.write_text(s)
          PY
          node --test tests/pom-rx-core-durable-promise-prototype-regression.node.test.mjs
          git checkout -- tests/pom-rx-core-durable-promise-prototype-regression.node.test.mjs
      - name: Stop before commit for evidence
        run: echo 'Evidence-only run; final regression contract will be tightened next.'