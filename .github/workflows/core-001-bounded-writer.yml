name: CORE-001 bounded repair writer

on:
  push:
    branches:
      - core/core-001-writer-20260901a

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: core/core-001-writer-20260901a
          fetch-depth: 0
          persist-credentials: true

      - name: Pin bounded writer and exact target
        shell: bash
        run: |
          set -euo pipefail
          cp .github/core-001-doc-proof-repair.py /tmp/core-001-doc-proof-repair.py
          git fetch origin main core/durable-gate-v2-20260830
          test "$(git rev-parse origin/core/durable-gate-v2-20260830)" = "706163917c9fc0f9bf6b719176aebfab768833aa"
          git checkout --detach 706163917c9fc0f9bf6b719176aebfab768833aa

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Apply bounded proof-boundary repair
        run: python /tmp/core-001-doc-proof-repair.py

      - name: Validate bounded surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | tee /tmp/core-files.txt
          if grep -E '^(applications/|sdk/|models/|\.github/)' /tmp/core-files.txt; then
            echo 'Non-Core scope leaked into CORE-001 repair' >&2
            exit 1
          fi
          if grep -Ei 'wallet-guard|swtk|pom-permit' /tmp/core-files.txt; then
            echo 'Application/token scope leaked into CORE-001 repair' >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Targeted CORE regressions
        run: |
          npm run test:pom-rx:durable-claim-store
          npm run test:pom-rx:exact-authorization-input-hardening
          npm run test:pom-rx:core-reference-gate

      - name: Full repository regression
        run: npm test

      - name: Publish exact-head successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'POM-RX CORE-001 Writer'
          git config user.email 'actions@users.noreply.github.com'
          git add core/gate/DURABLE-COMPOSITION.md tests/pom-rx-core-durable-merge-blocker-regressions.node.test.mjs
          git diff --cached --check
          git commit -m 'docs(core): preserve downstream ambiguity proof boundary'
          NEW_SHA=$(git rev-parse HEAD)
          echo "successor=$NEW_SHA"
          git push --force-with-lease=refs/heads/core/durable-gate-v2-20260830:706163917c9fc0f9bf6b719176aebfab768833aa origin HEAD:refs/heads/core/durable-gate-v2-20260830
