          import subprocess
          allowed_prefixes = ('core/', 'tests/pom-rx-', 'docs/adr/ADR-POMRX-CORE-EXACT-AUTH-GATE.md', 'package.json')
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
