name: CORE-001 bounded repair writer

on:
  push:
    branches:
      - core/core-001-writer-20260901a

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: core/core-001-writer-20260901a
          fetch-depth: 0
          persist-credentials: true

      - name: Pin single writer and exact CORE-001 target
        shell: bash
        run: |
          set -euo pipefail
          cp .github/core-001-doc-proof-repair.py /tmp/core-001-local-p1-repair.py
          git fetch origin main core/durable-gate-v2-20260830
          test "$(git rev-parse origin/main)" = "76cd6cd315832c34b98cd14e305bc31fbf4f31ce"
          test "$(git rev-parse origin/core/durable-gate-v2-20260830)" = "ae4f4b1957ed58d432cc5b2ec8c2d99467067bc9"
          git checkout --detach ae4f4b1957ed58d432cc5b2ec8c2d99467067bc9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Apply bounded local P1 repair
        run: python /tmp/core-001-local-p1-repair.py

      - name: Validate bounded CORE surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "core/gate/reference-durable-claim-store.mjs"
          if git diff --name-only | grep -E '^(applications/|sdk/|models/|\.github/)'; then
            echo 'Non-Core scope leaked into CORE-001 repair' >&2
            exit 1
          fi
          if git diff | grep -Eiq 'wallet-guard|swtk|pom-permit'; then
            echo 'Application/token coupling leaked into CORE-001 repair' >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Repaired exact-head regressions must pass
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            --test-name-pattern='standalone durable-store promise chaining ignores post-import Promise species poisoning|durable completion realpath does not consume post-import Promise species internally' \
            tests/pom-rx-core-durable-latest-independent-review-regressions.node.test.mjs

      - name: Adjacent durable-store regressions must remain green
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/pom-rx-core-durable-promise-prototype-regression.node.test.mjs \
            tests/pom-rx-durable-claim-store.node.test.mjs \
            tests/pom-rx-durable-claim-store-root.node.test.mjs \
            tests/pom-rx-durable-claim-store-publication.node.test.mjs \
            tests/pom-rx-core-durable-gate-current-head-regressions.node.test.mjs \
            tests/pom-rx-core-durable-review-regressions.node.test.mjs \
            tests/pom-rx-core-durable-lifecycle-review-regressions.node.test.mjs

      - name: Publish exact-head successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'POM-RX CORE-001 Writer'
          git config user.email 'actions@users.noreply.github.com'
          git add core/gate/reference-durable-claim-store.mjs
          git diff --cached --check
          git commit -m 'fix(core): pin durable store species and realpath channels'
          NEW_SHA=$(git rev-parse HEAD)
          echo "successor=$NEW_SHA"
          git push --force-with-lease=refs/heads/core/durable-gate-v2-20260830:ae4f4b1957ed58d432cc5b2ec8c2d99467067bc9 origin HEAD:refs/heads/core/durable-gate-v2-20260830
