name: PR56 strict scanner expression-context repair

on:
  push:
    branches:
      - feat/pom-rx-strict-profile-activation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/pom-rx-strict-profile-activation
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Distinguish array-expression keywords from computed access
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('sdk/typescript/internal/pom-rx-v01-artifact-identity.mjs')
          text = path.read_text(encoding='utf-8')
          old = """    const computedMember = token.type === 'punctuator' && token.value === '[' && previous\n      && (['identifier', 'number', 'regex', 'string'].includes(previous.type)\n        || [')', ']', '}'].includes(previous.value));\n"""
          new = """    const computedMember = token.type === 'punctuator' && token.value === '[' && previous\n      && ((previous.type === 'identifier' && !REGEX_PREFIX_IDENTIFIERS.has(previous.value))\n        || ['number', 'regex', 'string'].includes(previous.type)\n        || [')', ']', '}'].includes(previous.value));\n"""
          if text.count(old) != 1:
              raise SystemExit('expected computedMember classifier exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
      - name: Regenerate strict artifact manifest
        shell: bash
        run: |
          tmp="$(mktemp)"; rm -f "$tmp"
          node scripts/generate-pom-rx-v01-strict-artifact-manifest.mjs "$tmp"
          mv "$tmp" core/strict-verification/pom-rx-v01-artifact-manifest.json
      - name: Validate full repository
        shell: bash
        run: |
          set +e
          npm ci > /tmp/pr56.log 2>&1
          ci_status=$?
          if [ "$ci_status" -eq 0 ]; then
            npm audit --omit=dev --audit-level=high >> /tmp/pr56.log 2>&1
            audit_status=$?
          else
            audit_status=99
          fi
          if [ "$ci_status" -eq 0 ] && [ "$audit_status" -eq 0 ]; then
            npm test >> /tmp/pr56.log 2>&1
            test_status=$?
          else
            test_status=99
          fi
          if [ "$test_status" -eq 0 ]; then
            rm -f PR56_REPAIR_DIAGNOSTICS.txt
          else
            {
              echo "ci_status=$ci_status"
              echo "audit_status=$audit_status"
              echo "test_status=$test_status"
              echo "--- tail ---"
              tail -n 300 /tmp/pr56.log
            } > PR56_REPAIR_DIAGNOSTICS.txt
          fi
          exit 0
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr56-self-repair-3.yml
          git add -A
          git commit -m "fix(pom-rx): distinguish array expressions in strict scanner"
          git push origin HEAD:feat/pom-rx-strict-profile-activation
