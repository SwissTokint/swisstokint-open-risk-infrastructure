name: CORE-001 bounded result-boundary writer

on:
  push:
    branches:
      - core/durable-gate-v2-20260830
    paths:
      - .github/workflows/core001-p1-result-boundary-writer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: core/durable-gate-v2-20260830
          fetch-depth: 0
      - name: Apply bounded CORE-001 result boundary repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('core/gate/reference-single-use-gate.mjs')
          source = source_path.read_text()

          source = source.replace(
              "const ARRAY_IS_ARRAY = Array.isArray;\nconst ARRAY_SORT = Array.prototype.sort;\nconst OBJECT_CREATE = Object.create;",
              "const ARRAY_CONSTRUCTOR = Array;\nconst ARRAY_IS_ARRAY = Array.isArray;\nconst ARRAY_SORT = Array.prototype.sort;\nconst OBJECT_CREATE = Object.create;\nconst OBJECT_DEFINE_PROPERTY = Object.defineProperty;",
              1,
          )
          source = source.replace(
              "const OBJECT_GET_OWN_PROPERTY_DESCRIPTORS = Object.getOwnPropertyDescriptors;\nconst OBJECT_GET_OWN_PROPERTY_SYMBOLS = Object.getOwnPropertySymbols;",
              "const OBJECT_GET_OWN_PROPERTY_DESCRIPTORS = Object.getOwnPropertyDescriptors;\nconst OBJECT_GET_OWN_PROPERTY_NAMES = Object.getOwnPropertyNames;\nconst OBJECT_GET_OWN_PROPERTY_SYMBOLS = Object.getOwnPropertySymbols;",
              1,
          )
          source = source.replace(
              "function objectGetOwnPropertyDescriptors(value) {\n  return REFLECT_APPLY(OBJECT_GET_OWN_PROPERTY_DESCRIPTORS, Object, [value]);\n}\n\nfunction objectGetOwnPropertySymbols(value) {",
              "function objectDefineProperty(value, key, descriptor) {\n  return REFLECT_APPLY(OBJECT_DEFINE_PROPERTY, Object, [value, key, descriptor]);\n}\n\nfunction objectGetOwnPropertyDescriptors(value) {\n  return REFLECT_APPLY(OBJECT_GET_OWN_PROPERTY_DESCRIPTORS, Object, [value]);\n}\n\nfunction objectGetOwnPropertyNames(value) {\n  return REFLECT_APPLY(OBJECT_GET_OWN_PROPERTY_NAMES, Object, [value]);\n}\n\nfunction objectGetOwnPropertySymbols(value) {",
              1,
          )

          old = '''function snapshotDownstreamResult(value) {
            if (value === null) return null;
            const type = typeof value;
            if (type !== 'object' && type !== 'function') return value;
            if (type === 'function') {
              throw gateError(
                'POMRX_GATE_E_DOWNSTREAM_FAILED',
                'Downstream returned a non-inert result after execution',
              );
            }
            try {
              return captureReferencePlainData(value, 'trusted Gate downstream result');
            } catch {
              throw gateError(
                'POMRX_GATE_E_DOWNSTREAM_FAILED',
                'Downstream returned a non-inert or out-of-bounds result after execution',
              );
            }
          }
          '''
          new = '''function rematerializeDetachedResult(value, root = false) {
            if (value === null || typeof value !== 'object') return value;

            let result;
            if (arrayIsArray(value)) {
              result = REFLECT_CONSTRUCT(ARRAY_CONSTRUCTOR, [value.length]);
              for (let index = 0; index < value.length; index += 1) {
                result[index] = rematerializeDetachedResult(value[index]);
              }
            } else {
              result = createObject(OBJECT_PROTOTYPE);
              const descriptors = objectGetOwnPropertyDescriptors(value);
              const names = objectGetOwnPropertyNames(value);
              for (let index = 0; index < names.length; index += 1) {
                const key = names[index];
                const descriptor = descriptors[key];
                if (!descriptor || !objectHasOwn(descriptor, 'value')) {
                  throw gateError(
                    'POMRX_GATE_E_DOWNSTREAM_FAILED',
                    'Detached downstream result lost its plain-data boundary',
                  );
                }
                result[key] = rematerializeDetachedResult(descriptor.value);
              }
            }

            if (root) {
              if (objectHasOwn(result, 'then')) {
                throw gateError(
                  'POMRX_GATE_E_DOWNSTREAM_FAILED',
                  'Downstream result root cannot expose an own then field',
                );
              }
              objectDefineProperty(result, 'then', {
                value: undefined,
                enumerable: false,
                writable: false,
                configurable: false,
              });
            }
            return freezeValue(result);
          }

          function snapshotDownstreamResult(value) {
            if (value === null) return null;
            const type = typeof value;
            if (type !== 'object' && type !== 'function') return value;
            if (type === 'function') {
              throw gateError(
                'POMRX_GATE_E_DOWNSTREAM_FAILED',
                'Downstream returned a non-inert result after execution',
              );
            }
            try {
              const detached = captureReferencePlainData(value, 'trusted Gate downstream result');
              return rematerializeDetachedResult(detached, true);
            } catch (error) {
              if (error instanceof PomRxGateError) throw error;
              throw gateError(
                'POMRX_GATE_E_DOWNSTREAM_FAILED',
                'Downstream returned a non-inert or out-of-bounds result after execution',
              );
            }
          }
          '''
          if old not in source:
              raise SystemExit('expected snapshotDownstreamResult block not found')
          source = source.replace(old, new, 1)
          source_path.write_text(source)

          test_path = Path('tests/pom-rx-core-durable-review-regressions.node.test.mjs')
          test = test_path.read_text()
          test = test.replace(
              "    let thenGets = 0;\n    let attackCalls = 0;\n    let harness;",
              "    let thenGets = 0;\n    let attackCalls = 0;\n    let harness;\n    const downstreamResult = Object.freeze({ accepted: true });",
              1,
          )
          test = test.replace(
              "        executeDownstream: () => Object.freeze({ accepted: true }),",
              "        executeDownstream: () => downstreamResult,",
              1,
          )
          test = test.replace(
              "        get() {\n          thenGets += 1;\n          if (thenGets === 1) return undefined;",
              "        get() {\n          if (this !== downstreamResult) return undefined;\n          thenGets += 1;\n          if (thenGets === 1) return undefined;",
              1,
          )
          test = test.replace(
              "      assert.equal(Object.getPrototypeOf(result), null);",
              "      assert.equal(Object.getPrototypeOf(result), Object.prototype);\n      assert.deepEqual(result, { accepted: true });\n      assert.deepEqual(Object.getOwnPropertyDescriptor(result, 'then'), {\n        value: undefined,\n        enumerable: false,\n        writable: false,\n        configurable: false,\n      });",
              1,
          )
          test = test.replace(
              "      assert.equal(attackCalls, 0);\n      assert.ok(thenGets >= 1);",
              "      assert.equal(attackCalls, 0);\n      assert.equal(thenGets, 1);",
              1,
          )
          test_path.write_text(test)
          PY
          node --test tests/pom-rx-core-reference-gate.node.test.mjs tests/pom-rx-core-durable-review-regressions.node.test.mjs tests/pom-rx-core-exact-authorization-intrinsic.node.test.mjs
          git config user.name 'pom-rx-core-writer'
          git config user.email 'pom-rx-core-writer@users.noreply.github.com'
          git add core/gate/reference-single-use-gate.mjs tests/pom-rx-core-durable-review-regressions.node.test.mjs
          git commit -m 'fix(core): preserve result shape across inert return boundary'
          git push origin HEAD:core/durable-gate-v2-20260830
