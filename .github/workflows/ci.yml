name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-001-repair:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'core/durable-gate-v2-20260830' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded CORE-001 child-directory pinning repair
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/core-001-repair.py
          python3 /tmp/core-001-repair.py
      - name: Verify child-directory rebinding regression
        run: node --test tests/pom-rx-core-durable-child-directory-rebinding.node.test.mjs
      - name: Verify full repository tests before writer commit
        run: npm test
      - name: Commit bounded repair and restore canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          git show 5d79f6966c74a522021fd9571b21526fec91bb67:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'SwissTokint Prime Writer'
          git config user.email 'actions@users.noreply.github.com'
          git add core/gate/reference-durable-claim-store.mjs .github/workflows/ci.yml
          git commit -m 'fix(core): pin durable claim child directory'
          git push origin HEAD:core/durable-gate-v2-20260830

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Immutable action refs prevent upstream tag retargeting. Update the SHA
      # and its release annotation together after reviewing the upstream diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # POM-RX fixture conformance binds immutable artifacts to historical
          # Git blob identities; a shallow clone must fail that proof closed.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install Python proof SDK
        run: python -m pip install --disable-pip-version-check ./sdk/python
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Reproduce strict verifier artifact manifest from two clean trees
        shell: bash
        run: |
          set -euo pipefail
          repository_root="$(pwd)"
          scratch="$(mktemp -d)"
          first_tree="$scratch/first-tree"
          second_tree="$scratch/second-tree"
          first_manifest="$scratch/first-manifest.json"
          second_manifest="$scratch/second-manifest.json"

          cleanup() {
            git worktree remove --force "$first_tree" >/dev/null 2>&1 || true
            git worktree remove --force "$second_tree" >/dev/null 2>&1 || true
            rm -rf "$scratch"
          }
          trap cleanup EXIT

          git worktree add --detach "$first_tree" HEAD >/dev/null
          git worktree add --detach "$second_tree" HEAD >/dev/null

          (
            cd "$first_tree"
            node scripts/generate-pom-rx-v01-strict-artifact-manifest.mjs "$first_manifest" >/dev/null
          )
          (
            cd "$second_tree"
            node scripts/generate-pom-rx-v01-strict-artifact-manifest.mjs "$second_manifest" >/dev/null
          )

          if [ ! -f "$repository_root/core/strict-verification/pom-rx-v01-artifact-manifest.json" ]; then
            echo "Committed strict artifact manifest is missing." >&2
            exit 1
          fi
          cmp --silent "$first_manifest" "$second_manifest"
          if ! cmp --silent "$first_manifest" "$repository_root/core/strict-verification/pom-rx-v01-artifact-manifest.json"; then
            echo "Committed strict artifact manifest differs from deterministic generation:" >&2
            diff -u "$repository_root/core/strict-verification/pom-rx-v01-artifact-manifest.json" "$first_manifest" >&2 || true
            exit 1
          fi
      - run: npm test
      - name: Assert tracked POM-RX integrity gaps remain expected-red
        run: npm run test:pom-rx:integrity-baseline:expected-red
      - name: Add Stellar contract build target
        run: rustup target add wasm32v1-none
      - name: Install attested Stellar CLI
        uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4 # v7
        with:
          version: 27.0.0
      - name: Test Stellar evidence registry
        working-directory: integrations/stellar-evidence-registry
        run: cargo test
      - name: Build optimized Stellar contract
        working-directory: integrations/stellar-evidence-registry
        run: stellar contract build
      - name: Build hardened proof relay image
        run: docker build -f examples/proof-relay/Dockerfile -t swisstokint-proof-relay:ci .
