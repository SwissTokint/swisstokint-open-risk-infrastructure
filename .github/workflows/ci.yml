name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-001-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'core/durable-gate-v2-20260830' && github.event.pull_request.head.sha == '5d79f6966c74a522021fd9571b21526fec91bb67'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded CORE-001 child-directory pinning repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/gate/reference-durable-claim-store.mjs')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "const WEAK_MAP_SET = WeakMap.prototype.set;\n",
              "const WEAK_MAP_SET = WeakMap.prototype.set;\n"
              "const SET_CONSTRUCTOR = Set;\n"
              "const SET_ADD = Set.prototype.add;\n"
              "const SET_DELETE = Set.prototype.delete;\n"
              "const SET_FOR_EACH = Set.prototype.forEach;\n",
          )

          replace_once(
              "function weakMapSet(map, key, value) {\n"
              "  REFLECT_APPLY(WEAK_MAP_SET, map, [key, value]);\n"
              "}\n",
              "function weakMapSet(map, key, value) {\n"
              "  REFLECT_APPLY(WEAK_MAP_SET, map, [key, value]);\n"
              "}\n\n"
              "function setAdd(set, value) {\n"
              "  REFLECT_APPLY(SET_ADD, set, [value]);\n"
              "}\n\n"
              "function setDelete(set, value) {\n"
              "  REFLECT_APPLY(SET_DELETE, set, [value]);\n"
              "}\n\n"
              "function setForEach(set, callback) {\n"
              "  REFLECT_APPLY(SET_FOR_EACH, set, [callback]);\n"
              "}\n",
          )

          replace_once(
              "  const handleState = new WEAK_MAP_CONSTRUCTOR();\n"
              "  let trustedRootPromise = null;\n",
              "  const handleState = new WEAK_MAP_CONSTRUCTOR();\n"
              "  const openClaimStates = new SET_CONSTRUCTOR();\n"
              "  let trustedRootPromise = null;\n",
          )

          marker = "  async function trustedRoot() {\n"
          helper = """  function pinClaimDirectorySync(claimDirectory) {
    let fd = null;
    try {
      const pathIdentity = fsLstatSyncSnapshot(claimDirectory);
      if (!statIsDirectory(pathIdentity) || statIsSymbolicLink(pathIdentity)) {
        fail('POMRX_GATE_E_DURABLE_CORRUPT', 'durable capability claim path is not a regular directory');
      }

      fd = openFdSync(claimDirectory, 'r', 0o600);
      const fdIdentity = fsFstatSyncSnapshot(fd);
      if (!statIsDirectory(fdIdentity)
          || statIsSymbolicLink(fdIdentity)
          || fdIdentity.dev !== pathIdentity.dev
          || fdIdentity.ino !== pathIdentity.ino
          || fdIdentity.mode !== pathIdentity.mode
          || fdIdentity.uid !== pathIdentity.uid) {
        fail('POMRX_GATE_E_DURABLE_CORRUPT', 'durable capability claim directory changed while being pinned');
      }

      let operationRoot = claimDirectory;
      if (PROCESS_PLATFORM === 'linux') {
        operationRoot = `/proc/self/fd/${fd}`;
        const operationIdentity = fsStatSyncSnapshot(operationRoot);
        if (!statIsDirectory(operationIdentity)
            || operationIdentity.dev !== pathIdentity.dev
            || operationIdentity.ino !== pathIdentity.ino) {
          fail('POMRX_GATE_E_DURABLE_CORRUPT', 'pinned capability descriptor path does not resolve to the claimed directory');
        }
      }

      const pinned = createObject(null);
      pinned.fd = fd;
      pinned.dev = pathIdentity.dev;
      pinned.ino = pathIdentity.ino;
      pinned.mode = pathIdentity.mode;
      pinned.uid = pathIdentity.uid;
      pinned.operationRoot = operationRoot;
      return freezeValue(pinned);
    } catch (error) {
      closeFdSyncIgnoringFailure(fd);
      if (error instanceof PomRxDurableClaimStoreError) throw error;
      fail('POMRX_GATE_E_DURABLE_CORRUPT', 'durable capability claim directory could not be pinned');
    }
  }

  function assertPinnedClaimDirectorySync(state) {
    try {
      const pathIdentity = fsLstatSyncSnapshot(state.claimDirectory);
      const fdIdentity = fsFstatSyncSnapshot(state.claimFd);
      let operationIdentity = null;
      if (PROCESS_PLATFORM === 'linux') {
        operationIdentity = fsStatSyncSnapshot(state.claimOperationRoot);
      }

      const pathMismatch = !statIsDirectory(pathIdentity)
        || statIsSymbolicLink(pathIdentity)
        || pathIdentity.dev !== state.claimDev
        || pathIdentity.ino !== state.claimIno
        || pathIdentity.mode !== state.claimMode
        || pathIdentity.uid !== state.claimUid;
      const fdMismatch = !statIsDirectory(fdIdentity)
        || statIsSymbolicLink(fdIdentity)
        || fdIdentity.dev !== state.claimDev
        || fdIdentity.ino !== state.claimIno
        || fdIdentity.mode !== state.claimMode
        || fdIdentity.uid !== state.claimUid;
      const operationMismatch = operationIdentity !== null
        && (!statIsDirectory(operationIdentity)
          || operationIdentity.dev !== state.claimDev
          || operationIdentity.ino !== state.claimIno);
      if (pathMismatch || fdMismatch || operationMismatch) {
        fail('POMRX_GATE_E_DURABLE_CORRUPT', 'durable capability claim directory identity changed before completion');
      }
    } catch (error) {
      if (error instanceof PomRxDurableClaimStoreError) throw error;
      fail('POMRX_GATE_E_DURABLE_CORRUPT', 'durable capability claim directory identity changed before completion');
    }
  }

  function withPinnedClaimDirectoryCritical(state, operation) {
    assertPinnedClaimDirectorySync(state);
    try {
      return operation(state.claimOperationRoot);
    } finally {
      assertPinnedClaimDirectorySync(state);
    }
  }

  function releasePinnedClaimDirectorySync(state) {
    const fd = state.claimFd;
    if (fd === null) return;
    state.claimFd = null;
    setDelete(openClaimStates, state);
    try {
      const identity = fsFstatSyncSnapshot(fd);
      if (statIsDirectory(identity)
          && !statIsSymbolicLink(identity)
          && identity.dev === state.claimDev
          && identity.ino === state.claimIno) {
        closeFdSync(fd);
      }
    } catch {
      // If same-realm code already closed/reused the numeric descriptor, never
      // close an unverified foreign fd. The durable operation has already failed
      // closed through the pinned-identity checks.
    }
  }

"""
          replace_once(marker, helper + marker)

          replace_once(
              "      const claimRecord = makeClaimRecord(capabilityId, authorizationCommitment);\n"
              "      writeExclusiveDurableSync(PATH_JOIN(claimDirectory, 'claim.json'), claimRecord);\n\n"
              "      const handle = freezeValue(createObject(null));\n"
              "      weakMapSet(handleState, handle, {\n"
              "        state: 'OPEN',\n"
              "        claimDirectory,\n"
              "        claimRecord,\n"
              "      });\n",
              "      const claimRecord = makeClaimRecord(capabilityId, authorizationCommitment);\n"
              "      writeExclusiveDurableSync(PATH_JOIN(claimDirectory, 'claim.json'), claimRecord);\n\n"
              "      const pinnedClaim = pinClaimDirectorySync(claimDirectory);\n"
              "      const state = {\n"
              "        state: 'OPEN',\n"
              "        claimDirectory,\n"
              "        claimFd: pinnedClaim.fd,\n"
              "        claimDev: pinnedClaim.dev,\n"
              "        claimIno: pinnedClaim.ino,\n"
              "        claimMode: pinnedClaim.mode,\n"
              "        claimUid: pinnedClaim.uid,\n"
              "        claimOperationRoot: pinnedClaim.operationRoot,\n"
              "        claimRecord,\n"
              "      };\n"
              "      setAdd(openClaimStates, state);\n"
              "      const handle = freezeValue(createObject(null));\n"
              "      weakMapSet(handleState, handle, state);\n",
          )

          replace_once(
              "      const inspection = withPinnedRootCritical(rootRef, () => {\n"
              "        const rawPersistedClaim = readBoundedJsonSync(PATH_JOIN(state.claimDirectory, 'claim.json'));\n",
              "      const inspection = withPinnedRootCritical(rootRef, () => withPinnedClaimDirectoryCritical(state, (claimRoot) => {\n"
              "        const rawPersistedClaim = readBoundedJsonSync(PATH_JOIN(claimRoot, 'claim.json'));\n",
          )

          replace_once(
              "        writeExclusiveDurableSync(PATH_JOIN(state.claimDirectory, 'terminal.json'), terminalRecord);\n"
              "        return makeInspection(terminalState, state.claimRecord, terminalRecord);\n"
              "      });\n"
              "      state.state = terminalState;\n"
              "      return inspection;\n"
              "    } catch (error) {\n"
              "      state.state = 'FAILED_CLOSED';\n"
              "      throw error;\n"
              "    }\n",
              "        writeExclusiveDurableSync(PATH_JOIN(claimRoot, 'terminal.json'), terminalRecord);\n"
              "        return makeInspection(terminalState, state.claimRecord, terminalRecord);\n"
              "      }));\n"
              "      state.state = terminalState;\n"
              "      return inspection;\n"
              "    } catch (error) {\n"
              "      state.state = 'FAILED_CLOSED';\n"
              "      throw error;\n"
              "    } finally {\n"
              "      releasePinnedClaimDirectorySync(state);\n"
              "    }\n",
          )

          replace_once(
              "      let root = null;\n"
              "      if (trustedRootPromise !== null) {\n",
              "      setForEach(openClaimStates, (state) => {\n"
              "        releasePinnedClaimDirectorySync(state);\n"
              "      });\n\n"
              "      let root = null;\n"
              "      if (trustedRootPromise !== null) {\n",
          )

          path.write_text(text)
          PY
      - name: Verify child-directory rebinding regression
        run: node --test tests/pom-rx-core-durable-child-directory-rebinding.node.test.mjs
      - name: Verify full repository tests before writer commit
        run: npm test
      - name: Commit only the bounded CORE-001 repair and restore canonical CI workflow
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          changed="$(git diff --name-only)"
          if [ "$changed" != "core/gate/reference-durable-claim-store.mjs" ] && [ "$changed" != $'.github/workflows/ci.yml\ncore/gate/reference-durable-claim-store.mjs' ] && [ "$changed" != $'core/gate/reference-durable-claim-store.mjs\n.github/workflows/ci.yml' ]; then
            echo "Unexpected writer diff:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'SwissTokint Prime Writer'
          git config user.email 'actions@users.noreply.github.com'
          git add core/gate/reference-durable-claim-store.mjs .github/workflows/ci.yml
          git commit -m 'fix(core): pin durable claim child directory'
          git push origin HEAD:core/durable-gate-v2-20260830

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Immutable action refs prevent upstream tag retargeting. Update the SHA
      # and its release annotation together after reviewing the upstream diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # POM-RX fixture conformance binds immutable artifacts to historical
          # Git blob identities; a shallow clone must fail that proof closed.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install Python proof SDK
        run: python -m pip install --disable-pip-version-check ./sdk/python
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Reproduce strict verifier artifact manifest from two clean trees
        shell: bash
        run: |
          set -euo pipefail
          repository_root="$(pwd)"
          scratch="$(mktemp -d)"
          first_tree="$scratch/first-tree"
          second_tree="$scratch/second-tree"
          first_manifest="$scratch/first-manifest.json"
          second_manifest="$scratch/second-manifest.json"

          cleanup() {
            git worktree remove --force "$first_tree" >/dev/null 2>&1 || true
            git worktree remove --force "$second_tree" >/dev/null 2>&1 || true
            rm -rf "$scratch"
          }
          trap cleanup EXIT

          git worktree add --detach "$first_tree" HEAD >/dev/null
          git worktree add --detach "$second_tree" HEAD >/dev/null

          (
            cd "$first_tree"
            node scripts/generate-pom-rx-v01-strict-artifact-manifest.mjs "$first_manifest" >/dev/null
          )
          (
            cd "$second_tree"
            node scripts/generate-pom-rx-v01-strict-artifact-manifest.mjs "$second_manifest" >/dev/null
          )

          if [ ! -f "$repository_root/core/strict-verification/pom-rx-v01-artifact-manifest.json" ]; then
            echo "Committed strict artifact manifest is missing." >&2
            exit 1
          fi
          cmp --silent "$first_manifest" "$second_manifest"
          if ! cmp --silent "$first_manifest" "$repository_root/core/strict-verification/pom-rx-v01-artifact-manifest.json"; then
            echo "Committed strict artifact manifest differs from deterministic generation:" >&2
            diff -u "$repository_root/core/strict-verification/pom-rx-v01-artifact-manifest.json" "$first_manifest" >&2 || true
            exit 1
          fi
      - run: npm test
      - name: Assert tracked POM-RX integrity gaps remain expected-red
        run: npm run test:pom-rx:integrity-baseline:expected-red
      - name: Add Stellar contract build target
        run: rustup target add wasm32v1-none
      - name: Install attested Stellar CLI
        uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4
        with:
          version: 27.0.0
      - name: Test Stellar evidence registry
        working-directory: integrations/stellar-evidence-registry
        run: cargo test
      - name: Build optimized Stellar contract
        working-directory: integrations/stellar-evidence-registry
        run: stellar contract build
      - name: Build hardened proof relay image
        run: docker build -f examples/proof-relay/Dockerfile -t swisstokint-proof-relay:ci .
