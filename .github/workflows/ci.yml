name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install Python proof SDK
        run: python -m pip install --disable-pip-version-check ./sdk/python
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
