name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Immutable action refs prevent upstream tag retargeting. Update the SHA
      # and its release annotation together after reviewing the upstream diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # POM-RX fixture conformance binds immutable artifacts to historical
          # Git blob identities; a shallow clone must fail that proof closed.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install Python proof SDK
        run: python -m pip install --disable-pip-version-check ./sdk/python
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Reproduce strict verifier artifact manifest from two clean trees
        shell: bash
        run: |
          set -euo pipefail
          repository_root="$(pwd)"
          scratch="$(mktemp -d)"
          first_tree="$scratch/first-tree"
          second_tree="$scratch/second-tree"
          first_manifest="$scratch/first-manifest.json"
          second_manifest="$scratch/second-manifest.json"

          cleanup() {
            git worktree remove --force "$first_tree" >/dev/null 2>&1 || true
            git worktree remove --force "$second_tree" >/dev/null 2>&1 || true
            rm -rf "$scratch"
          }
          trap cleanup EXIT

          git worktree add --detach "$first_tree" HEAD >/dev/null
          git worktree add --detach "$second_tree" HEAD >/dev/null

          (
            cd "$first_tree"
            node scripts/generate-pom-rx-v01-strict-artifact-manifest.mjs "$first_manifest" >/dev/null
          )
          (
            cd "$second_tree"
            node scripts/generate-pom-rx-v01-strict-artifact-manifest.mjs "$second_manifest" >/dev/null
          )

          if [ ! -f "$repository_root/core/strict-verification/pom-rx-v01-artifact-manifest.json" ]; then
            echo "Committed strict artifact manifest is missing." >&2
            exit 1
          fi
          cmp --silent "$first_manifest" "$second_manifest"
          cmp --silent "$first_manifest" "$repository_root/core/strict-verification/pom-rx-v01-artifact-manifest.json"
      - name: Diagnostic full-suite group A — baseline and proof
        run: >-
          npm run test:risk &&
          npm run test:proof &&
          npm run test:pom-rx:member-lab &&
          npm run test:pom-rx:v01-fixtures &&
          npm run test:pom-rx:profile-foundation &&
          npm run test:pom-rx:action-continuity &&
          npm run test:pom-rx:input-continuity &&
          npm run test:pom-rx:execution-assertion-consistency &&
          npm run test:pom-rx:reconciliation-assertion-consistency &&
          npm run test:pom-rx:receipt-id-uniqueness
      - name: Diagnostic full-suite group B — strict verifier, witness and authorization
        run: >-
          npm run test:pom-rx:strict-activation &&
          npm run test:pom-rx:strict-package &&
          npm run test:pom-rx:strict-isolated-runner &&
          npm run test:pom-rx:artifact-scanner-regression &&
          npm run test:pom-rx:witness-primitives &&
          npm run test:pom-rx:witness-trust-lifecycle &&
          npm run test:pom-rx:exact-authorization-input-hardening
      - name: Diagnostic full-suite group C1 — Gate and durable consumption
        run: >-
          npm run test:pom-rx:core-reference-gate &&
          npm run test:pom-rx:core-reference-gate-object-boundary &&
          npm run test:pom-rx:core-reference-gate-temporal &&
          npm run test:pom-rx:durable-claim-store
      - name: Diagnostic full-suite group C2 — execution, plain data and observation
        run: >-
          npm run test:pom-rx:reference-execution-evidence &&
          npm run test:pom-rx:reference-plain-data &&
          npm run test:pom-rx:reference-observation
      - name: Diagnostic full-suite group D — Wallet Guard application
        run: >-
          npm run test:pom-rx:wallet-guard-intent-policy &&
          npm run test:pom-rx:wallet-guard-policy-object-boundary &&
          npm run test:pom-rx:wallet-guard-json-ingress &&
          npm run test:pom-rx:wallet-guard-policy-controller &&
          npm run test:pom-rx:wallet-guard-preflight-evidence &&
          npm run test:pom-rx:wallet-guard-witness-authorization &&
          npm run test:pom-rx:wallet-guard-decoded-effect &&
          npm run test:pom-rx:wallet-guard-provider-gate &&
          npm run test:pom-rx:wallet-guard-controlled-host
      - name: Diagnostic full-suite group E — repository contracts
        run: >-
          npm run test:pom-rx:capability-map &&
          npm run test:pom-rx:repository-layout &&
          npm run test:pom-rx:post-merge-assurance &&
          npm run test:public-identity
      - name: Assert tracked POM-RX integrity gaps remain expected-red
        run: npm run test:pom-rx:integrity-baseline:expected-red
      - name: Add Stellar contract build target
        run: rustup target add wasm32v1-none
      - name: Install attested Stellar CLI
        uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4
        with:
          version: 27.0.0
      - name: Test Stellar evidence registry
        working-directory: integrations/stellar-evidence-registry
        run: cargo test
      - name: Build optimized Stellar contract
        working-directory: integrations/stellar-evidence-registry
        run: stellar contract build
      - name: Build hardened proof relay image
        run: docker build -f examples/proof-relay/Dockerfile -t swisstokint-proof-relay:ci .
