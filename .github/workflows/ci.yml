name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install Python proof SDK
        run: python -m pip install --disable-pip-version-check ./sdk/python
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Add Stellar contract build target
        run: rustup target add wasm32v1-none
      - name: Install attested Stellar CLI
        uses: stellar/stellar-cli@8e402ea28202950b272fbabc34caad4d2f64fe87
        with:
          version: 27.0.0
      - name: Test Stellar evidence registry
        working-directory: integrations/stellar-evidence-registry
        run: cargo test
      - name: Build optimized Stellar contract
        working-directory: integrations/stellar-evidence-registry
        run: stellar contract build
      - name: Build hardened proof relay image
        run: docker build -f examples/proof-relay/Dockerfile -t swisstokint-proof-relay:ci .
