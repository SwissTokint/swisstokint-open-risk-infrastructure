name: CORE-001 bounded lifecycle P2 writer v2

on:
  push:
    branches:
      - core/durable-gate-v2-20260830
    paths:
      - .github/workflows/core001-lifecycle-p2-writer-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: core/durable-gate-v2-20260830
          fetch-depth: 0
      - name: Apply bounded CORE-001 lifecycle repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label} count={text.count(old)}')
              return text.replace(old, new, 1)

          store_path = Path('core/gate/reference-durable-claim-store.mjs')
          store = store_path.read_text()

          # P2 root metadata drift: ownership is stable dev/ino, while mode/uid
          # remain policy checks that may still make close() report invalidity.
          pattern = re.compile(r"function releasePinnedRootDescriptorSync\(root\) \{.*?\n\}", re.S)
          match = pattern.search(store)
          if not match:
              raise SystemExit('root release function not found')
          replacement = "\n".join([
              "function releasePinnedRootDescriptorSync(root) {",
              "  try {",
              "    const identity = fsFstatSyncSnapshot(root.fd);",
              "    if (statIsDirectory(identity)",
              "        && !statIsSymbolicLink(identity)",
              "        && identity.dev === root.dev",
              "        && identity.ino === root.ino) {",
              "      closeFdSync(root.fd);",
              "      return true;",
              "    }",
              "  } catch {",
              "    // Never close a descriptor whose stable ownership cannot be verified.",
              "  }",
              "  return false;",
              "}",
          ])
          store = store[:match.start()] + replacement + store[match.end():]

          inspect_marker = "\n  async function inspect(input) {"
          abandon_impl = "\n" + "\n".join([
              "  async function abandonImpl(handle) {",
              "    const state = weakMapGet(handleState, handle);",
              "    if (!state || state.state !== 'OPEN') {",
              "      fail('POMRX_GATE_E_DURABLE_STALE', 'durable claim handle is foreign or no longer open');",
              "    }",
              "    state.state = 'ABANDONING';",
              "    try {",
              "      assertPinnedClaimDirectorySync(state);",
              "      state.state = 'ABANDONED';",
              "      return makeInspection('RESERVED', state.claimRecord);",
              "    } catch (error) {",
              "      state.state = 'FAILED_CLOSED';",
              "      throw error;",
              "    } finally {",
              "      // No terminal truth is published; only the process-local fd is released.",
              "      releasePinnedClaimDirectorySync(state);",
              "    }",
              "  }",
              "",
          ])
          store = once(store, inspect_marker, abandon_impl + inspect_marker, 'inspect marker')

          close_marker = "\n  async function close() {"
          public_abandon = "\n" + "\n".join([
              "  async function abandon(handle) {",
              "    return runOperation(() => abandonImpl(handle));",
              "  }",
              "",
          ])
          store = once(store, close_marker, public_abandon + close_marker, 'store close marker')
          store = once(store, "    complete,\n    inspect,", "    complete,\n    abandon,\n    inspect,", 'store return marker')
          store_path.write_text(store)

          wrapper_path = Path('core/gate/reference-durable-single-use-gate.mjs')
          wrapper = wrapper_path.read_text()
          wrapper = once(wrapper, "import { types as utilTypes } from 'node:util';", "import { AsyncLocalStorage } from 'node:async_hooks';\nimport { types as utilTypes } from 'node:util';", 'util import')
          wrapper = once(wrapper, "const PROMISE_CONSTRUCTOR = Promise;", "const PROMISE_CONSTRUCTOR = Promise;\nconst ASYNC_LOCAL_STORAGE_CONSTRUCTOR = AsyncLocalStorage;\nconst ASYNC_LOCAL_STORAGE_RUN = AsyncLocalStorage.prototype.run;\nconst ASYNC_LOCAL_STORAGE_GET_STORE = AsyncLocalStorage.prototype.getStore;", 'promise constructor')

          helper_anchor = "\nfunction isOwnEnumerableDataDescriptor(descriptor) {"
          async_helpers = "\n" + "\n".join([
              "function asyncLocalRun(storage, value, callback) {",
              "  return REFLECT_APPLY(ASYNC_LOCAL_STORAGE_RUN, storage, [value, callback]);",
              "}",
              "",
              "function asyncLocalGetStore(storage) {",
              "  return REFLECT_APPLY(ASYNC_LOCAL_STORAGE_GET_STORE, storage, []);",
              "}",
              "",
          ])
          wrapper = once(wrapper, helper_anchor, async_helpers + helper_anchor, 'helper anchor')
          wrapper = once(wrapper, "  const wrapperState = new WEAK_MAP_CONSTRUCTOR();\n  let lifecycleState = 'OPEN';", "  const wrapperState = new WEAK_MAP_CONSTRUCTOR();\n  const consumeContext = new ASYNC_LOCAL_STORAGE_CONSTRUCTOR();\n  let lifecycleState = 'OPEN';", 'wrapper state')

          old_branch = "\n".join([
              "      } else if (innerState === 'CONSUMED_UNKNOWN') {",
              "        state.state = 'CONSUMED_UNKNOWN';",
              "      } else {",
              "        state.state = 'REJECTED';",
              "      }",
          ])
          new_branch = "\n".join([
              "      } else if (innerState === 'CONSUMED_UNKNOWN') {",
              "        state.state = 'CONSUMED_UNKNOWN';",
              "        await durableStore.abandon(durableClaim.handle);",
              "      } else {",
              "        state.state = 'REJECTED';",
              "        await durableStore.abandon(durableClaim.handle);",
              "      }",
          ])
          wrapper = once(wrapper, old_branch, new_branch, 'unknown/rejected branch')

          consume_start = wrapper.find("\n  async function consume(capability, executionAttempt) {")
          close_start = wrapper.find("\n  async function close() {", consume_start + 1)
          if consume_start < 0 or close_start < 0:
              raise SystemExit('consume/close slice not found')
          new_consume = "\n" + "\n".join([
              "  async function consume(capability, executionAttempt) {",
              "    return asyncLocalRun(consumeContext, true, async () => {",
              "      beginConsume();",
              "      try {",
              "        return await consumeImpl(capability, executionAttempt);",
              "      } finally {",
              "        endConsume();",
              "      }",
              "    });",
              "  }",
              "",
          ])
          wrapper = wrapper[:consume_start] + new_consume + wrapper[close_start:]

          close_sig = "  async function close() {\n"
          close_guard = close_sig + "\n".join([
              "    if (asyncLocalGetStore(consumeContext) === true) {",
              "      throw gateError(",
              "        'POMRX_GATE_E_REENTRANT_CLOSE',",
              "        'Reference durable Gate cannot close from its active consume context',",
              "      );",
              "    }",
          ]) + "\n"
          wrapper = once(wrapper, close_sig, close_guard, 'wrapper close signature')
          wrapper_path.write_text(wrapper)

          test_path = Path('tests/pom-rx-core-durable-lifecycle-review-regressions.node.test.mjs')
          test_path.write_text(r'''import assert from 'node:assert/strict';
          import { chmod, mkdtemp, readdir, readlink, rm } from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';
          import test from 'node:test';
          import { createReferenceDurableClaimStore } from '../core/gate/reference-durable-claim-store.mjs';
          import { createReferenceDurableSingleUseGateHarness } from '../core/gate/reference-durable-single-use-gate.mjs';

          const h = (c) => c.repeat(64);
          function bindingInput(index) {
            const s = String(index).padStart(4, '0');
            return {
              binding_profile: 'pom-rx-core-reference/0.1', run_id: `run-durable-lifecycle-${s}`,
              agent_ref: `agent-durable-lifecycle-${s}`, subject_ref: `subject-durable-lifecycle-${s}`,
              method_hash: h('1'), policy_hash: h('2'), action_commitment: h('3'), context_commitment: h('4'),
              preflight_receipt_hash: h('5'), witness_ack_hash: h('6'), source_key_id: `ed25519-${'a'.repeat(32)}`,
              witness_key_id: `ed25519-${'b'.repeat(32)}`, verification_profile: 'pom-rx-v0.1/strict-errata-1',
              verifier_version: 'pom-rx-v0.1-strict-verifier/1', implementation_artifact_sha256: h('7'),
              effective_verification_policy_sha256: h('8'), issued_at: '2026-08-30T12:00:00.000Z',
              expires_at: '2026-08-30T12:00:30.000Z',
            };
          }
          function observedFrom(e, overrides = {}) {
            return { binding_profile: e.binding.binding_profile, action_commitment: e.binding.action_commitment,
              context_commitment: e.binding.context_commitment, prepared_execution: { operation: 'durable-lifecycle-control' }, ...overrides };
          }
          function clock() { let i = 0; const v = ['2026-08-30T12:00:01.000Z', '2026-08-30T12:00:02.000Z']; return () => v[Math.min(i++, v.length - 1)]; }
          async function countTarget(target) {
            if (process.platform !== 'linux') return 0;
            const entries = await readdir('/proc/self/fd'); let count = 0;
            for (const entry of entries) { try { if (await readlink(`/proc/self/fd/${entry}`) === target) count += 1; } catch {} }
            return count;
          }

          test('nonterminal paths keep RESERVED tombstones without retaining child fds', { skip: process.platform !== 'linux', concurrency: false }, async () => {
            const rootDir = await mkdtemp(path.join(os.tmpdir(), 'pom-rx-abandon-fd-'));
            let rejectEvidence; let unknownEvidence; let mode = 'reject';
            const harness = createReferenceDurableSingleUseGateHarness({ rootDir, trustedClock: clock(),
              observeBinding: async () => mode === 'reject' ? observedFrom(rejectEvidence, { action_commitment: h('9') }) : observedFrom(unknownEvidence),
              executeDownstream: () => Promise.reject(new Error('ambiguous downstream channel')) });
            try {
              const rejected = harness.testAuthority.issueReferenceAuthorizationForTest(bindingInput(1), { witnessValidUntil: '2026-08-30T12:01:00.000Z' }); rejectEvidence = rejected.evidence;
              await assert.rejects(harness.gate.consume(rejected.capability, { raw: true }));
              assert.equal(harness.testAuthority.inspectCapabilityStateForTest(rejected.capability), 'REJECTED');
              assert.equal((await harness.testAuthority.inspectDurableStateForTest(rejected.capability)).state, 'RESERVED');
              assert.equal(await countTarget(path.join(rootDir, rejected.evidence.binding.capability_id)), 0);
              mode = 'unknown';
              const unknown = harness.testAuthority.issueReferenceAuthorizationForTest(bindingInput(2), { witnessValidUntil: '2026-08-30T12:01:00.000Z' }); unknownEvidence = unknown.evidence;
              await assert.rejects(harness.gate.consume(unknown.capability, { raw: true }));
              assert.equal(harness.testAuthority.inspectCapabilityStateForTest(unknown.capability), 'CONSUMED_UNKNOWN');
              assert.equal((await harness.testAuthority.inspectDurableStateForTest(unknown.capability)).state, 'RESERVED');
              assert.equal(await countTarget(path.join(rootDir, unknown.evidence.binding.capability_id)), 0);
            } finally { await harness.close().catch(() => {}); await rm(rootDir, { recursive: true, force: true }); }
          });

          test('reentrant awaited close fails closed without self-deadlock', { concurrency: false }, async () => {
            const rootDir = await mkdtemp(path.join(os.tmpdir(), 'pom-rx-reentrant-close-'));
            let evidence; let harness; let reentrantError = null;
            harness = createReferenceDurableSingleUseGateHarness({ rootDir, trustedClock: clock(),
              observeBinding: async () => { try { await harness.close(); } catch (error) { reentrantError = error; } return observedFrom(evidence); },
              executeDownstream: () => ({ accepted: true }) });
            try {
              const issued = harness.testAuthority.issueReferenceAuthorizationForTest(bindingInput(3), { witnessValidUntil: '2026-08-30T12:01:00.000Z' }); evidence = issued.evidence;
              const result = await Promise.race([harness.gate.consume(issued.capability, { raw: true }), new Promise((_, reject) => setTimeout(() => reject(new Error('deadlocked')), 750))]);
              assert.deepEqual(result, { accepted: true });
              assert.equal(reentrantError?.code, 'POMRX_GATE_E_REENTRANT_CLOSE');
              assert.equal(harness.testAuthority.inspectCapabilityStateForTest(issued.capability), 'CONSUMED_SUCCESS');
              await harness.close();
            } finally { await rm(rootDir, { recursive: true, force: true }); }
          });

          test('metadata-only root drift reports invalidity but releases verified owned fd', { skip: process.platform !== 'linux', concurrency: false }, async () => {
            const rootDir = await mkdtemp(path.join(os.tmpdir(), 'pom-rx-root-mode-drift-')); await chmod(rootDir, 0o700);
            const store = createReferenceDurableClaimStore({ rootDir });
            try {
              const claim = await store.claim({ capabilityId: `cap-${'c'.repeat(32)}`, authorizationCommitment: h('d') });
              await store.abandon(claim.handle); assert.equal(await countTarget(rootDir), 1); await chmod(rootDir, 0o755);
              await assert.rejects(store.close(), (error) => error?.code === 'POMRX_GATE_E_DURABLE_ROOT_INVALID');
              assert.equal(await countTarget(rootDir), 0);
            } finally { await chmod(rootDir, 0o700).catch(() => {}); await store.close().catch(() => {}); await rm(rootDir, { recursive: true, force: true }); }
          });
          ''')

          package_path = Path('package.json')
          package_text = package_path.read_text()
          needle = 'tests/pom-rx-core-durable-review-regressions.node.test.mjs tests/pom-rx-core-durable-fd-reuse.node.test.mjs'
          package_text = once(package_text, needle, 'tests/pom-rx-core-durable-review-regressions.node.test.mjs tests/pom-rx-core-durable-lifecycle-review-regressions.node.test.mjs tests/pom-rx-core-durable-fd-reuse.node.test.mjs', 'durable wiring')
          package_path.write_text(package_text)
          PY

          node --test tests/pom-rx-core-durable-lifecycle-review-regressions.node.test.mjs tests/pom-rx-core-durable-review-regressions.node.test.mjs tests/pom-rx-core-durable-fd-reuse.node.test.mjs tests/pom-rx-core-durable-gate.node.test.mjs tests/pom-rx-durable-claim-store-root.node.test.mjs
          git config user.name 'pom-rx-core-writer'
          git config user.email 'pom-rx-core-writer@users.noreply.github.com'
          git rm .github/workflows/core001-lifecycle-p2-writer-v2.yml
          git add core/gate/reference-durable-claim-store.mjs core/gate/reference-durable-single-use-gate.mjs tests/pom-rx-core-durable-lifecycle-review-regressions.node.test.mjs package.json
          git commit -m 'fix(core): release reserved claims and harden close lifecycle'
          git push origin HEAD:core/durable-gate-v2-20260830