name: CORE-001 bounded writer

on:
  push:
    branches: [core/durable-gate-v2-20260830]

permissions:
  contents: write

jobs:
  write:
    if: github.actor == 'SwissTokint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: core/durable-gate-v2-20260830
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: node scripts/core-001-writer-patch.mjs
      - run: npm ci
      - name: Verify exact repaired P1 regressions
        run: node --test tests/pom-rx-core-durable-independent-review-regressions.node.test.mjs
      - name: Commit bounded production repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "POM-RX CORE-001 Writer"
          git config user.email "action@github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(core): close independent review P1s"
          git push origin HEAD:core/durable-gate-v2-20260830
