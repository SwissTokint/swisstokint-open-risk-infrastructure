name: CORE-001 result rematerialization writer

on:
  push:
    branches:
      - core/durable-gate-v2-20260830
    paths:
      - .github/workflows/core001-result-rematerialization-writer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: core/durable-gate-v2-20260830
          fetch-depth: 0
      - name: Apply bounded rematerialization repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('core/gate/reference-single-use-gate.mjs')
          s = path.read_text()

          marker = '''function objectDefineProperty(value, key, descriptor) {
            return REFLECT_APPLY(OBJECT_DEFINE_PROPERTY, Object, [value, key, descriptor]);
          }
          '''
          helper = '''function objectDefineProperty(value, key, descriptor) {
            return REFLECT_APPLY(OBJECT_DEFINE_PROPERTY, Object, [value, key, descriptor]);
          }

          function defineDetachedDataProperty(value, key, propertyValue, options = null) {
            const descriptor = createObject(null);
            descriptor.value = propertyValue;
            descriptor.enumerable = options?.enumerable ?? true;
            descriptor.writable = options?.writable ?? true;
            descriptor.configurable = options?.configurable ?? true;
            objectDefineProperty(value, key, descriptor);
          }
          '''
          if s.count(marker) != 1:
              raise SystemExit(f'objectDefineProperty marker count={s.count(marker)}')
          s = s.replace(marker, helper, 1)

          old_array = '''    for (let index = 0; index < value.length; index += 1) {
              result[index] = rematerializeDetachedResult(value[index]);
            }
          '''
          new_array = '''    for (let index = 0; index < value.length; index += 1) {
              defineDetachedDataProperty(
                result,
                index,
                rematerializeDetachedResult(value[index]),
              );
            }
          '''
          if s.count(old_array) != 1:
              raise SystemExit(f'array rematerialization marker count={s.count(old_array)}')
          s = s.replace(old_array, new_array, 1)

          old_object = '''      result[key] = rematerializeDetachedResult(descriptor.value);
          '''
          new_object = '''      defineDetachedDataProperty(
                result,
                key,
                rematerializeDetachedResult(descriptor.value),
              );
          '''
          if s.count(old_object) != 1:
              raise SystemExit(f'object rematerialization marker count={s.count(old_object)}')
          s = s.replace(old_object, new_object, 1)

          old_then = '''    objectDefineProperty(result, 'then', {
              value: undefined,
              enumerable: false,
              writable: false,
              configurable: false,
            });
          '''
          new_then = '''    defineDetachedDataProperty(result, 'then', undefined, {
              enumerable: false,
              writable: false,
              configurable: false,
            });
          '''
          if s.count(old_then) != 1:
              raise SystemExit(f'root then descriptor marker count={s.count(old_then)}')
          s = s.replace(old_then, new_then, 1)

          path.write_text(s)
          PY
      - name: Target regressions
        run: node --test tests/pom-rx-core-durable-review-regressions.node.test.mjs tests/pom-rx-core-durable-promise-prototype-regression.node.test.mjs
      - name: Durable regression matrix
        run: npm run test:pom-rx:durable-claim-store
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pom-rx-core-writer'
          git config user.email 'pom-rx-core-writer@users.noreply.github.com'
          git rm .github/workflows/core001-result-rematerialization-writer.yml
          git add core/gate/reference-single-use-gate.mjs tests/pom-rx-core-durable-review-regressions.node.test.mjs
          git commit -m 'fix(core): bypass inherited setters in detached results'
          git push origin HEAD:core/durable-gate-v2-20260830