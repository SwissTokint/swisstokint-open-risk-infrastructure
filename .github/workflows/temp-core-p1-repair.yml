name: Temporary Core P1 Repair

on:
  push:
    branches: [core/durable-gate-v2-20260830]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: core/durable-gate-v2-20260830
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Apply five reviewed P1 repairs and exploit regressions
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          # P1: terminal publication and Unix permission semantics must be load-bound.
          durable = Path('core/gate/reference-durable-claim-store.mjs')
          text = durable.read_text()
          anchor = "const FS_CLOSE_FD = closeFdCallback;\n"
          if "const FS_LINK = link;" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('durable store capture anchor missing')
              text = text.replace(
                  anchor,
                  anchor + "const FS_LINK = link;\nconst PROCESS_PLATFORM = process.platform;\n",
                  1,
              )
          if text.count("await link(tempPath, filePath);") != 1:
              raise SystemExit('durable store live link call missing/unexpected')
          text = text.replace(
              "await link(tempPath, filePath);",
              "await REFLECT_APPLY(FS_LINK, undefined, [tempPath, filePath]);",
              1,
          )
          if text.count("process.platform !== 'win32'") != 1:
              raise SystemExit('durable store live process.platform check missing/unexpected')
          text = text.replace("process.platform !== 'win32'", "PROCESS_PLATFORM !== 'win32'", 1)
          durable.write_text(text)

          # P1: reason-array property keys must not dispatch through mutable global String.
          policy = Path('applications/blockchain-digital-assets/wallet-guard/policy.mjs')
          text = policy.read_text()
          string_index_count = text.count('String(index)')
          if string_index_count < 1:
              raise SystemExit('policy.mjs: expected live String(index) uses')
          text = text.replace('String(index)', 'index')
          policy.write_text(text)

          # P1: controlled-host audit insertion must not use mutable inherited Array.push.
          host = Path('applications/blockchain-digital-assets/wallet-guard/controlled-host.mjs')
          text = host.read_text()
          if text.count('String(index)') < 1:
              raise SystemExit('controlled-host.mjs: expected live String(index) use')
          text = text.replace('String(index)', 'index')
          old_push = '      state.sensitiveCalls.push(captureSensitiveRequest(request));'
          new_push = '''      defineArrayElement(\n        state.sensitiveCalls,\n        state.sensitiveCalls.length,\n        captureSensitiveRequest(request),\n      );'''
          if text.count(old_push) != 1:
              raise SystemExit('controlled-host.mjs: sensitiveCalls.push anchor missing')
          text = text.replace(old_push, new_push, 1)
          host.write_text(text)

          # P1: replay lookup/insertion must use module-initialization captured Set intrinsics.
          provider = Path('applications/blockchain-digital-assets/wallet-guard/provider.mjs')
          text = provider.read_text()
          capture_anchor = "const FORBIDDEN_KEYS = new Set(['__proto__', 'constructor', 'prototype']);\n"
          if 'const SET_HAS = Set.prototype.has;' not in text:
              if text.count(capture_anchor) != 1:
                  raise SystemExit('provider.mjs: Set capture anchor missing')
              text = text.replace(
                  capture_anchor,
                  capture_anchor
                  + 'const REFLECT_APPLY = Reflect.apply;\n'
                  + 'const SET_CONSTRUCTOR = Set;\n'
                  + 'const SET_HAS = Set.prototype.has;\n'
                  + 'const SET_ADD = Set.prototype.add;\n',
                  1,
              )
          fail_anchor = '''function fail(code, message) {\n  throw new WalletGuardProviderError(code, message);\n}\n'''
          helpers = '''\nfunction setHas(set, value) {\n  return REFLECT_APPLY(SET_HAS, set, [value]);\n}\n\nfunction setAdd(set, value) {\n  REFLECT_APPLY(SET_ADD, set, [value]);\n}\n'''
          if 'function setHas(set, value)' not in text:
              if text.count(fail_anchor) != 1:
                  raise SystemExit('provider.mjs: fail helper anchor missing')
              text = text.replace(fail_anchor, fail_anchor + helpers, 1)
          for old, new in [
              ('const usedRunIds = new Set();', 'const usedRunIds = new SET_CONSTRUCTOR();'),
              ('const usedPreflightHashes = new Set();', 'const usedPreflightHashes = new SET_CONSTRUCTOR();'),
              ('const usedWitnessHashes = new Set();', 'const usedWitnessHashes = new SET_CONSTRUCTOR();'),
              ('usedRunIds.has(referenceAuthorization.run_id)', 'setHas(usedRunIds, referenceAuthorization.run_id)'),
              ('usedPreflightHashes.has(referenceAuthorization.preflight_receipt_hash)', 'setHas(usedPreflightHashes, referenceAuthorization.preflight_receipt_hash)'),
              ('usedWitnessHashes.has(referenceAuthorization.witness_ack_hash)', 'setHas(usedWitnessHashes, referenceAuthorization.witness_ack_hash)'),
              ('usedRunIds.add(referenceAuthorization.run_id);', 'setAdd(usedRunIds, referenceAuthorization.run_id);'),
              ('usedPreflightHashes.add(referenceAuthorization.preflight_receipt_hash);', 'setAdd(usedPreflightHashes, referenceAuthorization.preflight_receipt_hash);'),
              ('usedWitnessHashes.add(referenceAuthorization.witness_ack_hash);', 'setAdd(usedWitnessHashes, referenceAuthorization.witness_ack_hash);'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'provider.mjs: expected exactly one {old!r}')
              text = text.replace(old, new, 1)
          provider.write_text(text)

          # Durable exploit regressions.
          durable_test = Path('tests/pom-rx-core-durable-gate-intrinsic-hardening.node.test.mjs')
          text = durable_test.read_text()
          text = text.replace(
              "import {\n  mkdtemp,\n  open,\n  rm,\n} from 'node:fs/promises';",
              "import fsPromises, {\n  chmod,\n  mkdtemp,\n  open,\n  rm,\n} from 'node:fs/promises';\nimport { syncBuiltinESMExports } from 'node:module';",
              1,
          )
          marker = "post-claim builtin fs/promises link synchronization cannot suppress terminal publication"
          if marker not in text:
              text += r'''

test('post-claim builtin fs/promises link synchronization cannot suppress terminal publication', async () => {
  const rootDir = await tempDir('pom-rx-durable-terminal-link-capture-');
  const input = {
    capabilityId: `cap-${'7'.repeat(32)}`,
    authorizationCommitment: h('8'),
  };
  const originalLink = fsPromises.link;

  try {
    const store = createReferenceDurableClaimStore({ rootDir });
    const claimed = await store.claim(input);

    fsPromises.link = async function poisonedLink() {
      // A vulnerable live ESM binding reports publication success without
      // linking the fully fsynced temp inode into terminal.json.
    };
    syncBuiltinESMExports();

    const completed = await store.complete(claimed.handle, 'error');
    assert.equal(completed.state, 'CONSUMED_ERROR');

    fsPromises.link = originalLink;
    syncBuiltinESMExports();
    const reopened = createReferenceDurableClaimStore({ rootDir });
    assert.equal((await reopened.inspect(input)).state, 'CONSUMED_ERROR');
  } finally {
    fsPromises.link = originalLink;
    syncBuiltinESMExports();
    await rm(rootDir, { recursive: true, force: true });
  }
});

test('post-import process.platform poisoning cannot admit a world-writable Unix durable root', async (t) => {
  if (process.platform === 'win32') {
    t.skip('Unix permission invariant');
    return;
  }
  const descriptor = Object.getOwnPropertyDescriptor(process, 'platform');
  if (!descriptor?.configurable) {
    t.skip('process.platform is not configurable on this runtime');
    return;
  }

  const rootDir = await tempDir('pom-rx-durable-platform-capture-');
  const input = {
    capabilityId: `cap-${'9'.repeat(32)}`,
    authorizationCommitment: h('a'),
  };
  await chmod(rootDir, 0o777);

  try {
    const store = createReferenceDurableClaimStore({ rootDir });
    Object.defineProperty(process, 'platform', { ...descriptor, value: 'win32' });
    await assert.rejects(
      store.claim(input),
      (error) => {
        assert.equal(error?.code, 'POMRX_GATE_E_DURABLE_ROOT_INVALID');
        return true;
      },
    );
  } finally {
    Object.defineProperty(process, 'platform', descriptor);
    await chmod(rootDir, 0o700).catch(() => {});
    await rm(rootDir, { recursive: true, force: true });
  }
});
'''
          durable_test.write_text(text)

          # Wallet Guard exploit regressions.
          host_test = Path('tests/wallet-guard/controlled-host-v2.node.test.mjs')
          text = host_test.read_text()
          marker = 'post-await global String poisoning cannot erase a policy DENY'
          if marker not in text:
              text += r'''

test('post-await global String poisoning cannot erase a policy DENY', async () => {
  const OriginalString = globalThis.String;
  const { page, testAuthority } = createHost();
  const pending = page.ethereum.request(sendTransaction({
    to: OTHER_ACCOUNT,
    value: '0x1',
  }));

  try {
    globalThis.String = function poisonedString(value) {
      if (typeof value === 'number') return '999999';
      return Reflect.apply(OriginalString, undefined, [value]);
    };
    const result = await pending;
    assert.equal(result.decision, 'DENY');
    assert.equal(result.forwarded, false);
  } finally {
    globalThis.String = OriginalString;
  }

  assert.equal(testAuthority.inspect().sensitive_call_count, 0);
});

test('post-await Array.prototype.push poisoning cannot suppress sensitive-call audit evidence', async () => {
  const originalPush = Array.prototype.push;
  let poisonInstalled = false;
  const { page, testAuthority } = createHost({
    referenceAuthorizationForRequest: referenceAuthorizationFactory({
      onCall: () => {
        if (poisonInstalled) return;
        poisonInstalled = true;
        Array.prototype.push = function poisonedPush(...values) {
          if (values.length === 1
              && values[0]
              && typeof values[0] === 'object'
              && values[0].method === 'eth_sendTransaction') {
            return this.length;
          }
          return Reflect.apply(originalPush, this, values);
        };
      },
    }),
  });

  try {
    const result = await page.ethereum.request(sendTransaction({ value: '0x1' }));
    assert.equal(result.decision, 'ALLOW');
    assert.equal(result.forwarded, true);
  } finally {
    Array.prototype.push = originalPush;
  }

  const state = testAuthority.inspect();
  assert.equal(state.sensitive_call_count, 1);
  assert.equal(state.sensitive_calls[0].method, 'eth_sendTransaction');
});

test('post-await Set.prototype.has poisoning cannot replay identical reference authorization', async () => {
  const originalHas = Set.prototype.has;
  const repeatedAuthorization = referenceAuthorizationRecord(1);
  let calls = 0;
  const { page, testAuthority } = createHost({
    referenceAuthorizationForRequest: () => {
      calls += 1;
      if (calls === 2) {
        Set.prototype.has = function poisonedHas() {
          return false;
        };
        queueMicrotask(() => {
          Set.prototype.has = originalHas;
        });
      }
      return repeatedAuthorization;
    },
  });

  try {
    const first = await page.ethereum.request(sendTransaction({ value: '0x1' }));
    assert.equal(first.forwarded, true);
    await assert.rejects(
      page.ethereum.request(sendTransaction({ value: '0x1' })),
      (error) => error?.code === 'POMRX_WG_PROVIDER_E_REFERENCE_REPLAY',
    );
  } finally {
    Set.prototype.has = originalHas;
  }

  assert.equal(calls, 2);
  assert.equal(testAuthority.inspect().sensitive_call_count, 1);
});
'''
          host_test.write_text(text)
          PY

          node --test tests/pom-rx-core-durable-gate-intrinsic-hardening.node.test.mjs
          node --test tests/wallet-guard/controlled-host-v2.node.test.mjs tests/wallet-guard/policy-intrinsic-regressions.node.test.mjs
          git diff --check
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair diff produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/gate/reference-durable-claim-store.mjs \
            applications/blockchain-digital-assets/wallet-guard/policy.mjs \
            applications/blockchain-digital-assets/wallet-guard/controlled-host.mjs \
            applications/blockchain-digital-assets/wallet-guard/provider.mjs \
            tests/pom-rx-core-durable-gate-intrinsic-hardening.node.test.mjs \
            tests/wallet-guard/controlled-host-v2.node.test.mjs
          git commit -m "fix(core): close exact-head intrinsic and replay P1s"
          git push origin HEAD:core/durable-gate-v2-20260830
