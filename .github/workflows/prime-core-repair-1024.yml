name: Prime Core bounded repair 1024

on:
  push:
    branches:
      - core/durable-gate-v2-20260830
    paths:
      - .github/workflows/prime-core-repair-1024.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/durable-gate-v2-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded repairs and exact regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          store = Path('core/gate/reference-durable-claim-store.mjs')
          s = store.read_text()
          s = once(s,
              "  close as closeFdCallback,\n  fsync as fsyncFdCallback,\n  open as openFdCallback,\n  writeFile as writeFileFdCallback,\n} from 'node:fs';",
              "  Stats,\n  close as closeFdCallback,\n  fsync as fsyncFdCallback,\n  open as openFdCallback,\n  writeFile as writeFileFdCallback,\n} from 'node:fs';",
              'Stats import')
          s = once(s,
              "const FS_CLOSE_FD = closeFdCallback;\nconst FS_LINK = link;\nconst PROCESS_PLATFORM = process.platform;",
              "const FS_CLOSE_FD = closeFdCallback;\nconst FS_LINK = link;\nconst FS_LSTAT = lstat;\nconst FS_MKDIR = mkdir;\nconst FS_READ_FILE = readFile;\nconst FS_REALPATH = realpath;\nconst FS_UNLINK = unlink;\nconst STATS_IS_DIRECTORY = Stats.prototype.isDirectory;\nconst STATS_IS_FILE = Stats.prototype.isFile;\nconst STATS_IS_SYMBOLIC_LINK = Stats.prototype.isSymbolicLink;\nconst PROCESS_PLATFORM = process.platform;",
              'fs/stat captures')
          s = once(s,
              "function arrayIsArray(value) {\n  return REFLECT_APPLY(ARRAY_IS_ARRAY, Array, [value]);\n}",
              "function fsLstat(filePath) {\n  return REFLECT_APPLY(FS_LSTAT, undefined, [filePath]);\n}\n\nfunction fsMkdir(filePath, options) {\n  return REFLECT_APPLY(FS_MKDIR, undefined, [filePath, options]);\n}\n\nfunction fsReadFile(filePath, options) {\n  return REFLECT_APPLY(FS_READ_FILE, undefined, [filePath, options]);\n}\n\nfunction fsRealpath(filePath) {\n  return REFLECT_APPLY(FS_REALPATH, undefined, [filePath]);\n}\n\nfunction fsUnlink(filePath) {\n  return REFLECT_APPLY(FS_UNLINK, undefined, [filePath]);\n}\n\nfunction statIsDirectory(stat) {\n  return REFLECT_APPLY(STATS_IS_DIRECTORY, stat, []);\n}\n\nfunction statIsFile(stat) {\n  return REFLECT_APPLY(STATS_IS_FILE, stat, []);\n}\n\nfunction statIsSymbolicLink(stat) {\n  return REFLECT_APPLY(STATS_IS_SYMBOLIC_LINK, stat, []);\n}\n\nfunction arrayIsArray(value) {\n  return REFLECT_APPLY(ARRAY_IS_ARRAY, Array, [value]);\n}",
              'fs/stat wrappers')
          replacements = {
              'await unlink(tempPath)': 'await fsUnlink(tempPath)',
              'await lstat(filePath)': 'await fsLstat(filePath)',
              "await readFile(filePath, 'utf8')": "await fsReadFile(filePath, 'utf8')",
              'await lstat(configuredRoot)': 'await fsLstat(configuredRoot)',
              'await realpath(configuredRoot)': 'await fsRealpath(configuredRoot)',
              'await lstat(claimDirectory)': 'await fsLstat(claimDirectory)',
              'await mkdir(claimDirectory, { mode: 0o700 })': 'await fsMkdir(claimDirectory, { mode: 0o700 })',
              '!stat.isFile() || stat.isSymbolicLink()': '!statIsFile(stat) || statIsSymbolicLink(stat)',
              '!stat.isDirectory()\n            || stat.isSymbolicLink()': '!statIsDirectory(stat)\n            || statIsSymbolicLink(stat)',
              '!directoryStat.isDirectory() || directoryStat.isSymbolicLink()': '!statIsDirectory(directoryStat) || statIsSymbolicLink(directoryStat)',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing durable-store replacement anchor: {old}')
              s = s.replace(old, new)
          if any(token in s for token in ('await lstat(', 'await realpath(', 'await readFile(', 'await mkdir(', 'await unlink(')):
              raise SystemExit('uncaptured fs/promises call remains')
          store.write_text(s)

          provider = Path('applications/blockchain-digital-assets/wallet-guard/provider.mjs')
          s = provider.read_text()
          s = once(s,
              "const REFLECT_APPLY = Reflect.apply;\nconst SET_CONSTRUCTOR = Set;",
              "const REFLECT_APPLY = Reflect.apply;\nconst ARRAY_CONSTRUCTOR = Array;\nconst ARRAY_IS_ARRAY = Array.isArray;\nconst OBJECT_DEFINE_PROPERTY = Object.defineProperty;\nconst OBJECT_FREEZE = Object.freeze;\nconst SET_CONSTRUCTOR = Set;",
              'provider captures')
          s = once(s,
              "function setHas(set, value) {\n  return REFLECT_APPLY(SET_HAS, set, [value]);\n}",
              "function arrayIsArray(value) {\n  return REFLECT_APPLY(ARRAY_IS_ARRAY, Array, [value]);\n}\n\nfunction defineArrayElement(array, index, value) {\n  REFLECT_APPLY(OBJECT_DEFINE_PROPERTY, Object, [array, index, {\n    value,\n    writable: true,\n    enumerable: true,\n    configurable: true,\n  }]);\n}\n\nfunction freezeValue(value) {\n  return REFLECT_APPLY(OBJECT_FREEZE, Object, [value]);\n}\n\nfunction setHas(set, value) {\n  return REFLECT_APPLY(SET_HAS, set, [value]);\n}",
              'provider wrappers')
          s = s.replace('Array.isArray(value)', 'arrayIsArray(value)')
          s = once(s,
              "function normalizeAccounts(value) {\n  if (!arrayIsArray(value) || value.length < 1 || value.length > MAX_ACCOUNTS) {\n    fail('POMRX_WG_PROVIDER_E_CONTEXT_INVALID', 'provider must expose a bounded non-empty accounts array');\n  }\n  const normalized = value.map(normalizeProviderAccount);\n  if (new SET_CONSTRUCTOR(normalized).size !== normalized.length) {\n    fail('POMRX_WG_PROVIDER_E_CONTEXT_INVALID', 'provider accounts cannot contain duplicates');\n  }\n  return Object.freeze(normalized);\n}",
              "function normalizeAccounts(value) {\n  if (!arrayIsArray(value) || value.length < 1 || value.length > MAX_ACCOUNTS) {\n    fail('POMRX_WG_PROVIDER_E_CONTEXT_INVALID', 'provider must expose a bounded non-empty accounts array');\n  }\n  const normalized = new ARRAY_CONSTRUCTOR(value.length);\n  const seen = new SET_CONSTRUCTOR();\n  for (let index = 0; index < value.length; index += 1) {\n    const account = normalizeProviderAccount(value[index]);\n    if (setHas(seen, account)) {\n      fail('POMRX_WG_PROVIDER_E_CONTEXT_INVALID', 'provider accounts cannot contain duplicates');\n    }\n    setAdd(seen, account);\n    defineArrayElement(normalized, index, account);\n  }\n  return freezeValue(normalized);\n}",
              'provider account normalization')
          s = once(s,
              "function sameAccounts(left, right) {\n  return left.length === right.length && left.every((value, index) => value === right[index]);\n}",
              "function sameAccounts(left, right) {\n  if (left.length !== right.length) return false;\n  for (let index = 0; index < left.length; index += 1) {\n    if (left[index] !== right[index]) return false;\n  }\n  return true;\n}",
              'provider account comparison')
          provider.write_text(s)

          core_test = Path('tests/pom-rx-core-durable-gate-intrinsic-hardening.node.test.mjs')
          s = core_test.read_text()
          if 'lstat live-binding poisoning cannot admit a world-writable Unix durable root' not in s:
              s += r'''

test('lstat live-binding poisoning cannot admit a world-writable Unix durable root', async (t) => {
  if (process.platform === 'win32') {
    t.skip('Unix permission invariant');
    return;
  }
  const rootDir = await tempDir('pom-rx-durable-lstat-capture-');
  const input = {
    capabilityId: `cap-${'b'.repeat(32)}`,
    authorizationCommitment: h('c'),
  };
  const originalLstat = fsPromises.lstat;
  await chmod(rootDir, 0o777);
  try {
    const store = createReferenceDurableClaimStore({ rootDir });
    fsPromises.lstat = async function poisonedLstat(target, ...args) {
      const stat = await Reflect.apply(originalLstat, fsPromises, [target, ...args]);
      if (path.resolve(target) !== path.resolve(rootDir)) return stat;
      return {
        mode: stat.mode & ~0o022,
        uid: stat.uid,
        size: stat.size,
        isDirectory: () => true,
        isFile: () => false,
        isSymbolicLink: () => false,
      };
    };
    syncBuiltinESMExports();
    await assert.rejects(
      store.claim(input),
      (error) => {
        assert.equal(error?.code, 'POMRX_GATE_E_DURABLE_ROOT_INVALID');
        return true;
      },
    );
  } finally {
    fsPromises.lstat = originalLstat;
    syncBuiltinESMExports();
    await chmod(rootDir, 0o700).catch(() => {});
    await rm(rootDir, { recursive: true, force: true });
  }
});
'''
          core_test.write_text(s)

          wg_test = Path('tests/wallet-guard/controlled-host-v2.node.test.mjs')
          s = wg_test.read_text()
          if 'post-await Array.prototype.map poisoning cannot substitute the provider active account' not in s:
              s += r'''

test('post-await Array.prototype.map poisoning cannot substitute the provider active account', async () => {
  const originalMap = Array.prototype.map;
  const { page, testAuthority } = createHost({ accounts: [OTHER_ACCOUNT] });
  const pending = page.ethereum.request(sendTransaction({
    from: ACCOUNT,
    value: '0x1',
  }));
  try {
    Array.prototype.map = function poisonedMap(callback, thisArg) {
      if (this.length === 1 && this[0] === OTHER_ACCOUNT) return [ACCOUNT];
      return Reflect.apply(originalMap, this, [callback, thisArg]);
    };
    await assert.rejects(pending);
  } finally {
    Array.prototype.map = originalMap;
  }
  assert.equal(testAuthority.inspect().sensitive_call_count, 0);
});
'''
          wg_test.write_text(s)
          PY
      - name: Run bounded regression set
        run: |
          node --test tests/pom-rx-core-durable-gate-intrinsic-hardening.node.test.mjs tests/wallet-guard/controlled-host-v2.node.test.mjs
          git diff --check
      - name: Commit repair and remove temporary writer
        run: |
          git config user.name "SwissTokint Prime Repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/prime-core-repair-1024.yml
          git add core/gate/reference-durable-claim-store.mjs applications/blockchain-digital-assets/wallet-guard/provider.mjs tests/pom-rx-core-durable-gate-intrinsic-hardening.node.test.mjs tests/wallet-guard/controlled-host-v2.node.test.mjs
          git commit -m "fix(core): harden root inspection and provider account capture"
          git push origin HEAD:core/durable-gate-v2-20260830
