name: HARD-002 bounded array-boundary writer

on:
  push:
    branches:
      - consolidation/wallet-guard-array-boundary-20260901

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Apply bounded compatibility repair and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('applications/blockchain-digital-assets/wallet-guard/policy.mjs')
          text = policy.read_text()
          old = """  if (Object.getPrototypeOf(values) !== Array.prototype) {
            fail('POMRX_WG_POLICY_E_INVALID', `${field} must use the standard Array prototype`);
          }
          """
          new = """  // The caller Array prototype is deliberately outside policy semantics.
          // This boundary reads only bounded own data descriptors and rematerializes
          // a fresh normalized Array, so inherited behavior must never participate.
          """
          if text.count(old) != 1:
              raise SystemExit('unexpected Wallet Guard dense-array prototype guard shape')
          policy.write_text(text.replace(old, new, 1))

          tests = Path('tests/wallet-guard/policy-object-boundary.node.test.mjs')
          text = tests.read_text()
          old = """test('custom-prototype policy arrays are rejected before inherited behavior can participate', () => {
            class PolicyArray extends Array {}
            const origins = new PolicyArray(ORIGIN);
            assert.throws(
              () => normalizeWalletGuardPolicy(basePolicy({ allowed_origins: origins })),
              expectPolicyCode,
            );
          });
          """
          new = """test('custom-prototype policy arrays normalize from own data without inherited behavior', () => {
            let inheritedGets = 0;
            const hostilePrototype = Object.create(null);
            Object.defineProperty(hostilePrototype, 'map', {
              configurable: false,
              enumerable: false,
              get() {
                inheritedGets += 1;
                throw new Error('inherited array behavior must not execute');
              },
            });
            Object.freeze(hostilePrototype);

            const origins = [ORIGIN];
            Object.setPrototypeOf(origins, hostilePrototype);

            const normalized = normalizeWalletGuardPolicy(
              basePolicy({ allowed_origins: origins }),
            );
            assert.deepEqual(normalized.allowed_origins, [ORIGIN]);
            assert.equal(inheritedGets, 0);
          });
          """
          if text.count(old) != 1:
              raise SystemExit('unexpected custom-prototype policy regression shape')
          tests.write_text(text.replace(old, new, 1))
          PY

      - name: Run focused regression
        run: node --test tests/wallet-guard/policy-object-boundary.node.test.mjs

      - name: Run full repository tests
        run: npm test

      - name: Enforce bounded diff and publish successor
        shell: bash
        run: |
          git rm .github/workflows/hard-002-array-boundary-writer.yml
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            .github/workflows/hard-002-array-boundary-writer.yml
            applications/blockchain-digital-assets/wallet-guard/policy.mjs
            tests/wallet-guard/policy-object-boundary.node.test.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo 'unexpected HARD-002 writer diff' >&2
            exit 1
          fi
          git config user.name 'pom-rx-consolidation-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add applications/blockchain-digital-assets/wallet-guard/policy.mjs tests/wallet-guard/policy-object-boundary.node.test.mjs
          git commit -m 'fix(wallet-guard): ignore inherited array prototype semantics'
          git push origin HEAD:consolidation/wallet-guard-array-boundary-20260901
