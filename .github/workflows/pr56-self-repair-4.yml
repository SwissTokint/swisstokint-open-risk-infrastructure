name: PR56 strict activation fixture-contract repair

on:
  push:
    branches:
      - feat/pom-rx-strict-profile-activation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/pom-rx-strict-profile-activation
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Make strict activation matrix honor frozen allow_partial contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/pom-rx-v01-strict-activation.node.test.mjs')
          text = path.read_text(encoding='utf-8')
          old_cases = """  const cases = [\n    ['POMRX-001-ACTION-PREFLIGHT-EXECUTION', 'POMRX_V01_E_ACTION_CONTINUITY'],\n    ['POMRX-001-ACTION-EXECUTION-RECONCILIATION', 'POMRX_V01_E_ACTION_CONTINUITY'],\n    ['POMRX-001-INPUT-PREFLIGHT-EXECUTION', 'POMRX_V01_E_INPUT_CONTINUITY'],\n    ['POMRX-006-EXECUTION-FAIL-ASSERTION', 'POMRX_V01_E_EXECUTION_ASSERTION_CONFLICT'],\n    ['POMRX-006-RECONCILIATION-FAIL-ASSERTION', 'POMRX_V01_E_RECONCILIATION_ASSERTION_CONFLICT'],\n    ['POMRX-007-DUPLICATE-RECEIPT-ID', 'POMRX_V01_E_DUPLICATE_RECEIPT_ID'],\n  ];\n\n  for (const [fixture, expectedCode] of cases) {\n    const verdict = verifyWithFreshPolicy(readChain(fixture));\n"""
          new_cases = """  const cases = [\n    ['POMRX-001-ACTION-PREFLIGHT-EXECUTION', 'POMRX_V01_E_ACTION_CONTINUITY', true],\n    ['POMRX-001-ACTION-EXECUTION-RECONCILIATION', 'POMRX_V01_E_ACTION_CONTINUITY', false],\n    ['POMRX-001-INPUT-PREFLIGHT-EXECUTION', 'POMRX_V01_E_INPUT_CONTINUITY', true],\n    ['POMRX-006-EXECUTION-FAIL-ASSERTION', 'POMRX_V01_E_EXECUTION_ASSERTION_CONFLICT', true],\n    ['POMRX-006-RECONCILIATION-FAIL-ASSERTION', 'POMRX_V01_E_RECONCILIATION_ASSERTION_CONFLICT', false],\n    ['POMRX-007-DUPLICATE-RECEIPT-ID', 'POMRX_V01_E_DUPLICATE_RECEIPT_ID', true],\n  ];\n\n  for (const [fixture, expectedCode, allowPartial] of cases) {\n    const verdict = verifyWithFreshPolicy(readChain(fixture), { allowPartial });\n"""
          if text.count(old_cases) != 1:
              raise SystemExit('expected strict activation matrix fragment exactly once')
          path.write_text(text.replace(old_cases, new_cases), encoding='utf-8', newline='\n')
          PY
      - name: Validate full repository
        shell: bash
        run: |
          set +e
          npm ci > /tmp/pr56.log 2>&1
          ci_status=$?
          if [ "$ci_status" -eq 0 ]; then
            npm audit --omit=dev --audit-level=high >> /tmp/pr56.log 2>&1
            audit_status=$?
          else
            audit_status=99
          fi
          if [ "$ci_status" -eq 0 ] && [ "$audit_status" -eq 0 ]; then
            npm test >> /tmp/pr56.log 2>&1
            test_status=$?
          else
            test_status=99
          fi
          if [ "$test_status" -eq 0 ]; then
            rm -f PR56_REPAIR_DIAGNOSTICS.txt
          else
            {
              echo "ci_status=$ci_status"
              echo "audit_status=$audit_status"
              echo "test_status=$test_status"
              echo "--- tail ---"
              tail -n 320 /tmp/pr56.log
            } > PR56_REPAIR_DIAGNOSTICS.txt
          fi
          exit 0
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr56-self-repair-4.yml
          git add -A
          git commit -m "test(pom-rx): honor frozen partial-chain fixture contract"
          git push origin HEAD:feat/pom-rx-strict-profile-activation
