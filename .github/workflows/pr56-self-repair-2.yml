name: PR56 strict scanner structural-token repair

on:
  push:
    branches:
      - feat/pom-rx-strict-profile-activation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/pom-rx-strict-profile-activation
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Restrict bracket analysis to punctuator tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sdk/typescript/internal/pom-rx-v01-artifact-identity.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "const computedMember = token.value === '[' && previous",
                  "const computedMember = token.type === 'punctuator' && token.value === '[' && previous",
              ),
              (
                  "    if (token.value === '[') {",
                  "    if (token.type === 'punctuator' && token.value === '[') {",
              ),
              (
                  "        if (tokens[cursor].value === '[') depth += 1;",
                  "        if (tokens[cursor].type === 'punctuator' && tokens[cursor].value === '[') depth += 1;",
              ),
              (
                  "        else if (tokens[cursor].value === ']') depth -= 1;",
                  "        else if (tokens[cursor].type === 'punctuator' && tokens[cursor].value === ']') depth -= 1;",
              ),
              (
                  "      const computedProperty = tokens[cursor]?.value === ':';",
                  "      const computedProperty = tokens[cursor]?.type === 'punctuator' && tokens[cursor]?.value === ':';",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one scanner fragment: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Regenerate strict artifact manifest
        shell: bash
        run: |
          tmp="$(mktemp)"
          rm -f "$tmp"
          node scripts/generate-pom-rx-v01-strict-artifact-manifest.mjs "$tmp"
          mv "$tmp" core/strict-verification/pom-rx-v01-artifact-manifest.json

      - name: Validate and capture diagnostics
        shell: bash
        run: |
          set +e
          npm ci > /tmp/pr56-validate.log 2>&1
          ci_status=$?
          if [ "$ci_status" -eq 0 ]; then
            npm audit --omit=dev --audit-level=high >> /tmp/pr56-validate.log 2>&1
            audit_status=$?
          else
            audit_status=99
          fi
          if [ "$ci_status" -eq 0 ] && [ "$audit_status" -eq 0 ]; then
            npm test >> /tmp/pr56-validate.log 2>&1
            test_status=$?
          else
            test_status=99
          fi
          if [ "$test_status" -eq 0 ]; then
            rm -f PR56_REPAIR_DIAGNOSTICS.txt
          else
            {
              echo "ci_status=$ci_status"
              echo "audit_status=$audit_status"
              echo "test_status=$test_status"
              echo "--- tail ---"
              tail -n 260 /tmp/pr56-validate.log
            } > PR56_REPAIR_DIAGNOSTICS.txt
          fi
          exit 0

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr56-self-repair-2.yml
          git add -A sdk/typescript/internal/pom-rx-v01-artifact-identity.mjs core/strict-verification/pom-rx-v01-artifact-manifest.json PR56_REPAIR_DIAGNOSTICS.txt .github/workflows/pr56-self-repair-2.yml || true
          git commit -am "fix(pom-rx): make strict scanner token-aware"
          git push origin HEAD:feat/pom-rx-strict-profile-activation
