name: CORE-001 Promise boundary writer

on:
  push:
    branches:
      - core/durable-gate-v2-20260830
    paths:
      - .github/workflows/core001-promise-boundary-writer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: core/durable-gate-v2-20260830
          fetch-depth: 0
      - name: Repair mutable Promise-prototype boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('core/gate/reference-durable-claim-store.mjs')
          s = path.read_text()

          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, got {count}')
              s = s.replace(old, new, 1)

          once(
              'const OBJECT_CREATE = Object.create;\nconst OBJECT_FREEZE = Object.freeze;',
              'const OBJECT_CREATE = Object.create;\nconst OBJECT_DEFINE_PROPERTY = Object.defineProperty;\nconst OBJECT_FREEZE = Object.freeze;',
              'capture Object.defineProperty',
          )
          once(
              'const PROMISE_CONSTRUCTOR = Promise;\nconst FS_OPEN_FD = openFdCallback;',
              "const PROMISE_CONSTRUCTOR = Promise;\nconst PROMISE_THEN = Promise.prototype.then;\nconst PROMISE_OWN_CONSTRUCTOR_DESCRIPTOR = REFLECT_APPLY(OBJECT_FREEZE, Object, [{\n  value: PROMISE_CONSTRUCTOR,\n  configurable: false,\n  enumerable: false,\n  writable: false,\n}]);\nconst PROMISE_OWN_THEN_DESCRIPTOR = REFLECT_APPLY(OBJECT_FREEZE, Object, [{\n  value: PROMISE_THEN,\n  configurable: false,\n  enumerable: false,\n  writable: false,\n}]);\nconst FS_OPEN_FD = openFdCallback;",
              'capture Promise boundary',
          )
          once(
              'const PROCESS_PLATFORM = process.platform;\n\nfunction makeStatSnapshot(stat) {',
              "const PROCESS_PLATFORM = process.platform;\n\nfunction stabilizePromise(promise) {\n  // Await uses PromiseResolve(%Promise%, value). Giving every internally created\n  // result channel an immutable own constructor equal to the captured intrinsic\n  // makes that operation return the native promise directly instead of consulting\n  // a mutable inherited `.then`. The own captured `.then` also protects direct\n  // consumer chaining from post-import Promise.prototype replacement.\n  REFLECT_APPLY(OBJECT_DEFINE_PROPERTY, Object, [\n    promise,\n    'constructor',\n    PROMISE_OWN_CONSTRUCTOR_DESCRIPTOR,\n  ]);\n  REFLECT_APPLY(OBJECT_DEFINE_PROPERTY, Object, [\n    promise,\n    'then',\n    PROMISE_OWN_THEN_DESCRIPTOR,\n  ]);\n  return promise;\n}\n\nfunction makeStatSnapshot(stat) {",
              'insert stabilizePromise',
          )

          # Promise-producing primitive wrappers: harden the object before any caller can await/chain it.
          for label, old, new in [
              ('fsLstat promise', '  return new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_LSTAT, undefined, [filePath, (error, stat) => {', '  return stabilizePromise(new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_LSTAT, undefined, [filePath, (error, stat) => {'),
              ('fsStat promise', '  return new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_STAT, undefined, [filePath, (error, stat) => {', '  return stabilizePromise(new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_STAT, undefined, [filePath, (error, stat) => {'),
              ('fsFstat promise', '  return new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_FSTAT_FD, undefined, [fd, (error, stat) => {', '  return stabilizePromise(new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_FSTAT_FD, undefined, [fd, (error, stat) => {'),
              ('openFd promise', '  return new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_OPEN_FD, undefined, [filePath, flags, mode, (error, fd) => {', '  return stabilizePromise(new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_OPEN_FD, undefined, [filePath, flags, mode, (error, fd) => {'),
              ('writeFileFd promise', '  return new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_WRITE_FILE_FD, undefined, [fd, value, encoding, (error) => {', '  return stabilizePromise(new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_WRITE_FILE_FD, undefined, [fd, value, encoding, (error) => {'),
              ('fsyncFd promise', '  return new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_FSYNC_FD, undefined, [fd, (error) => {', '  return stabilizePromise(new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_FSYNC_FD, undefined, [fd, (error) => {'),
              ('closeFd promise', '  return new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_CLOSE_FD, undefined, [fd, (error) => {', '  return stabilizePromise(new PROMISE_CONSTRUCTOR((resolve, reject) => {\n    REFLECT_APPLY(FS_CLOSE_FD, undefined, [fd, (error) => {'),
          ]:
              once(old, new, label)

          # Close the newly added stabilizePromise( calls for callback-created promises.
          # Each targeted wrapper previously ended with exactly `  });` immediately before its next function.
          replacements = [
              ('  });\n}\n\nfunction fsStat(filePath)', '  }));\n}\n\nfunction fsStat(filePath)', 'fsLstat close'),
              ('  });\n}\n\nfunction fsFstat(fd)', '  }));\n}\n\nfunction fsFstat(fd)', 'fsStat close'),
              ('  });\n}\n\nfunction fsMkdir(filePath, options)', '  }));\n}\n\nfunction fsMkdir(filePath, options)', 'fsFstat close'),
              ('  });\n}\n\nfunction writeFileFd(fd, value, encoding)', '  }));\n}\n\nfunction writeFileFd(fd, value, encoding)', 'openFd close'),
              ('  });\n}\n\nfunction fsyncFd(fd)', '  }));\n}\n\nfunction fsyncFd(fd)', 'writeFile close'),
              ('  });\n}\n\nfunction closeFd(fd)', '  }));\n}\n\nfunction closeFd(fd)', 'fsync close'),
              ('  });\n}\n\nasync function closeFdIgnoringFailure(fd)', '  }));\n}\n\nasync function closeFdIgnoringFailure(fd)', 'closeFd close'),
          ]
          for old, new, label in replacements:
              once(old, new, label)

          # fs/promises wrappers return native promises directly: stabilize those too.
          for label, old, new in [
              ('fsMkdir', '  return REFLECT_APPLY(FS_MKDIR, undefined, [filePath, options]);', '  return stabilizePromise(REFLECT_APPLY(FS_MKDIR, undefined, [filePath, options]));'),
              ('fsReadFile', '  return REFLECT_APPLY(FS_READ_FILE, undefined, [filePath, options]);', '  return stabilizePromise(REFLECT_APPLY(FS_READ_FILE, undefined, [filePath, options]));'),
              ('fsRealpath', '  return REFLECT_APPLY(FS_REALPATH, undefined, [filePath]);', '  return stabilizePromise(REFLECT_APPLY(FS_REALPATH, undefined, [filePath]));'),
              ('fsUnlink', '  return REFLECT_APPLY(FS_UNLINK, undefined, [filePath]);', '  return stabilizePromise(REFLECT_APPLY(FS_UNLINK, undefined, [filePath]));'),
          ]:
              once(old, new, label)

          # Async helper-return channels must themselves be stabilized at each internal await.
          s = s.replace('await closeFdIgnoringFailure(fd);', 'await stabilizePromise(closeFdIgnoringFailure(fd));')
          s = s.replace('await fsyncDirectory(directory);', 'await stabilizePromise(fsyncDirectory(directory));')
          s = s.replace('return await operation();', 'return await stabilizePromise(operation());')
          s = s.replace('stat = await fsLstat(configuredRoot);', 'stat = await fsLstat(configuredRoot);')  # primitive already stabilized
          s = s.replace('resolved = await fsRealpath(configuredRoot);', 'resolved = await fsRealpath(configuredRoot);')

          # trustedRoot contains async helper calls in addition to hardened primitive promises.
          s = s.replace('const pathIdentity = await inspectConfiguredRoot();', 'const pathIdentity = await stabilizePromise(inspectConfiguredRoot());')
          s = s.replace('await fsyncDirectory(PATH_DIRNAME(configuredRoot));', 'await stabilizePromise(fsyncDirectory(PATH_DIRNAME(configuredRoot)));')
          s = s.replace('trustedRootPromise = (async () => {', 'trustedRootPromise = stabilizePromise((async () => {')
          once('      })();\n    }\n\n    const root = await trustedRootPromise;', '      })());\n    }\n\n    const root = await trustedRootPromise;', 'close trustedRoot bootstrap stabilize')
          s = s.replace('const currentPathIdentity = await inspectConfiguredRoot();', 'const currentPathIdentity = await stabilizePromise(inspectConfiguredRoot());')

          # Every call to the async trustedRoot helper is hardened before await.
          s = s.replace('const rootRef = await trustedRoot();', 'const rootRef = await stabilizePromise(trustedRoot());')

          # Public result channels must be stabilized before they escape to a caller.
          for name, args, impl in [
              ('inspect', 'input', 'inspectImpl(input)'),
              ('claim', 'input', 'claimImpl(input)'),
              ('complete', 'handle, outcome', 'completeImpl(handle, outcome)'),
              ('abandon', 'handle', 'abandonImpl(handle)'),
          ]:
              old = f"  async function {name}({args}) {{\n    return runOperation(() => {impl});\n  }}"
              new = f"  function {name}({args}) {{\n    return stabilizePromise(runOperation(() => {impl}));\n  }}"
              once(old, new, f'public {name}')

          # close() gets a non-async public wrapper so the Promise is hardened before caller assimilation.
          close_start = s.find("  async function close() {\n")
          return_start = s.find("\n  return freezeValue({\n", close_start)
          if close_start < 0 or return_start < 0:
              raise SystemExit('close function slice not found')
          old_close = s[close_start:return_start]
          new_close = '''  function close() {
            if (lifecycleState === 'CLOSED') {
              return stabilizePromise(new PROMISE_CONSTRUCTOR((resolve) => resolve()));
            }
            if (lifecycleState === 'CLOSING') return closePromise;

            lifecycleState = 'CLOSING';
            closePromise = stabilizePromise((async () => {
              try {
                if (activeOperations > 0) {
                  await stabilizePromise(new PROMISE_CONSTRUCTOR((resolve) => {
                    drainResolve = resolve;
                  }));
                }

                setForEach(openClaimStates, (state) => {
                  releasePinnedClaimDirectorySync(state);
                });

                let root = null;
                if (trustedRootPromise !== null) {
                  try {
                    root = await trustedRootPromise;
                  } catch {
                    root = null;
                  }
                }
                if (root !== null) {
                  let identityError = null;
                  try {
                    assertPinnedRootSync(root);
                  } catch (error) {
                    identityError = error;
                  }
                  const released = releasePinnedRootDescriptorSync(root);
                  if (!released && identityError === null) {
                    fail('POMRX_GATE_E_DURABLE_IO', 'durable claim root descriptor could not be closed');
                  }
                  if (identityError !== null) throw identityError;
                }
              } finally {
                lifecycleState = 'CLOSED';
              }
            })());
            return closePromise;
          }
'''
          s = s[:close_start] + new_close + s[return_start:]

          path.write_text(s)
          PY

          node --test tests/pom-rx-core-durable-promise-prototype-regression.node.test.mjs
          npm run test:pom-rx:durable-claim-store
          git config user.name 'pom-rx-core-writer'
          git config user.email 'pom-rx-core-writer@users.noreply.github.com'
          git rm .github/workflows/core001-promise-boundary-writer.yml
          git add core/gate/reference-durable-claim-store.mjs tests/pom-rx-core-durable-promise-prototype-regression.node.test.mjs package.json
          git commit -m 'fix(core): isolate durable Promise result channels'
          git push origin HEAD:core/durable-gate-v2-20260830